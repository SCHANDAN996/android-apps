name: mistri_calculator
description: "Mistri Calculator - Ghar ka Hisab | मिस्त्री कैलकुलेटर"
publish_to: 'none'
version: 1.0.0+2

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.3.4
  google_mobile_ads: ^9.0.0
  in_app_review: ^2.0.10
  share_plus: ^10.1.4
  intl: ^0.20.2
  google_fonts: ^6.2.1
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  image_path: "../play_store_assets/app_icon_512.png"
  adaptive_icon_background: "#E65100"
  adaptive_icon_foreground: "../play_store_assets/app_icon_512.png"

flutter:
  uses-material-design: true
