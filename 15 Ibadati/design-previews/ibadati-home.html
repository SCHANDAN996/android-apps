<style>
#ib-home{--h-bg:light-dark(#f4f1e8,#0d2724);--h-surface:light-dark(#fffdf7,#14332f);--h-text:light-dark(#18332f,#f7f1df);--h-muted:light-dark(#687873,#b6c6bf);--h-accent:light-dark(#176b5b,#77c7ad);--h-accent-text:light-dark(#fff,#09231f);--h-gold:light-dark(#b58b3b,#d8b768);--h-line:light-dark(rgba(23,107,91,.14),rgba(119,199,173,.18));font-family:Inter,system-ui,sans-serif;color:var(--h-text);display:grid;place-items:center;padding:12px}
#ib-home *{box-sizing:border-box}#ib-home .device{width:min(100%,390px);background:var(--h-bg);border:1px solid var(--h-line);border-radius:34px;overflow:hidden;box-shadow:0 22px 70px rgba(0,0,0,.16)}
#ib-home .status{display:flex;justify-content:space-between;padding:18px 22px 7px;font-size:12px;font-weight:500}#ib-home .sys{display:flex;gap:8px}#ib-home .sys i{width:14px;height:14px}#ib-home .content{padding:13px 18px 0}
#ib-home .head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}#ib-home .place{display:flex;align-items:center;gap:9px}#ib-home .brandmark{width:34px;height:34px;border-radius:12px 12px 12px 4px;background:var(--h-accent);color:var(--h-accent-text);display:grid;place-items:center}#ib-home .brandmark i{width:18px;height:18px}#ib-home .place strong{display:block;font-size:14px;font-weight:500}#ib-home .place small{display:block;color:var(--h-muted);font-size:11px;margin-top:2px}#ib-home .iconbtn{width:44px;height:44px;border:0;background:transparent;color:var(--h-text);display:grid;place-items:center;cursor:pointer}#ib-home .iconbtn i{width:20px;height:20px}
#ib-home .hero{position:relative;overflow:hidden;background:var(--h-accent);color:var(--h-accent-text);border-radius:24px;padding:20px 20px 17px;margin-bottom:19px}#ib-home .hero:before{content:"";position:absolute;width:180px;height:180px;border-radius:50%;right:-70px;top:-70px;border:1px solid color-mix(in srgb,var(--h-accent-text) 18%,transparent);box-shadow:0 0 0 28px color-mix(in srgb,var(--h-accent-text) 4%,transparent),0 0 0 58px color-mix(in srgb,var(--h-accent-text) 3%,transparent)}#ib-home .hero-top{display:flex;justify-content:space-between;align-items:start;position:relative}#ib-home .hero-label{font-size:12px;opacity:.78}#ib-home .hero h1{font-size:30px;line-height:1;margin:8px 0 8px;font-weight:500;letter-spacing:-.02em}#ib-home .countdown{font-size:12px;opacity:.82}#ib-home .moon{width:44px;height:44px;border-radius:16px;background:color-mix(in srgb,var(--h-accent-text) 12%,transparent);display:grid;place-items:center}#ib-home .moon i{width:22px;height:22px}#ib-home .date{position:relative;margin-top:24px;padding-top:13px;border-top:1px solid color-mix(in srgb,var(--h-accent-text) 16%,transparent);display:flex;justify-content:space-between;font-size:11px;opacity:.82}
#ib-home .prayers{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-bottom:20px}#ib-home .prayer{border:0;background:transparent;color:var(--h-muted);padding:5px 2px;text-align:center;font:inherit;cursor:pointer}#ib-home .prayer span{display:block;font-size:11px}#ib-home .prayer strong{display:block;font-size:12px;font-weight:500;color:var(--h-text);margin-top:5px}#ib-home .prayer.active{background:var(--h-surface);border-radius:14px;color:var(--h-accent);padding:9px 2px;box-shadow:0 7px 20px color-mix(in srgb,var(--h-accent) 8%,transparent)}#ib-home .prayer.active strong{color:var(--h-accent)}
#ib-home .section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:11px}#ib-home .section-head h2{font-size:15px;font-weight:500;margin:0}#ib-home .section-head button{border:0;background:transparent;color:var(--h-accent);font:inherit;font-size:12px;cursor:pointer}
#ib-home .quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:20px}#ib-home .quick button{border:0;background:transparent;color:var(--h-text);font:inherit;font-size:11px;cursor:pointer;padding:0}#ib-home .quick span{width:54px;height:54px;margin:0 auto 7px;border-radius:18px;background:var(--h-surface);color:var(--h-accent);display:grid;place-items:center}#ib-home .quick i{width:22px;height:22px}
#ib-home .dhikr{background:var(--h-surface);border-radius:20px;padding:15px 16px;display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}#ib-home .dhikr small{color:var(--h-gold);font-size:11px}#ib-home .dhikr p{font-size:14px;margin:5px 0 2px}#ib-home .dhikr .meaning{font-size:11px;color:var(--h-muted)}#ib-home .count{width:48px;height:48px;border:0;border-radius:50%;background:color-mix(in srgb,var(--h-accent) 12%,var(--h-surface));color:var(--h-accent);font:inherit;font-weight:500;cursor:pointer}
#ib-home .toast{height:18px;text-align:center;color:var(--h-muted);font-size:11px}
#ib-home .nav{background:var(--h-surface);padding:9px 10px 14px;display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--h-line)}#ib-home .nav button{min-height:45px;border:0;background:transparent;color:var(--h-muted);font:inherit;font-size:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer}#ib-home .nav button i{width:19px;height:19px}#ib-home .nav button.active{color:var(--h-accent)}
@media(max-width:420px){#ib-home{padding:0}#ib-home .device{border-radius:26px}.quick{gap:4px}#ib-home .content{padding-left:15px;padding-right:15px}}
</style>
<div id="ib-home" aria-label="Ibadati home screen preview">
 <section class="device">
  <div class="status"><span>9:41</span><span class="sys"><i data-lucide="signal" aria-hidden="true"></i><i data-lucide="wifi" aria-hidden="true"></i><i data-lucide="battery-full" aria-hidden="true"></i></span></div>
  <main class="content">
   <header class="head"><div class="place"><span class="brandmark"><i data-lucide="moon-star" aria-hidden="true"></i></span><div><strong>Assalamu Alaikum</strong><small><i data-lucide="map-pin" aria-hidden="true" style="width:10px;height:10px;vertical-align:-1px"></i> New Delhi, India</small></div></div><button class="iconbtn" type="button" aria-label="Notifications"><i data-lucide="bell" aria-hidden="true"></i></button></header>
   <section class="hero"><div class="hero-top"><div><div class="hero-label">Next prayer</div><h1>Asr · 4:38 PM</h1><div class="countdown">in 2 hours 17 minutes</div></div><span class="moon"><i data-lucide="sunset" aria-hidden="true"></i></span></div><div class="date"><span>19 Rabi al-Awwal 1448</span><span>Wednesday, 2 Sep</span></div></section>
   <div class="prayers" aria-label="Today's prayer times"><button class="prayer"><span>Fajr</span><strong>5:02</strong></button><button class="prayer"><span>Dhuhr</span><strong>12:24</strong></button><button class="prayer active"><span>Asr</span><strong>4:38</strong></button><button class="prayer"><span>Maghrib</span><strong>6:41</strong></button><button class="prayer"><span>Isha</span><strong>8:01</strong></button></div>
   <div class="section-head"><h2>For your worship</h2><button type="button">See all</button></div>
   <div class="quick"><button type="button" data-name="Qibla"><span><i data-lucide="compass" aria-hidden="true"></i></span>Qibla</button><button type="button" data-name="Duas"><span><i data-lucide="hand-heart" aria-hidden="true"></i></span>Duas</button><button type="button" data-name="Tasbih"><span><i data-lucide="circle-dot" aria-hidden="true"></i></span>Tasbih</button><button type="button" data-name="Fasting"><span><i data-lucide="calendar-days" aria-hidden="true"></i></span>Fasting</button></div>
   <div class="section-head"><h2>Daily remembrance</h2><button type="button">View</button></div>
   <section class="dhikr"><div><small>Morning dhikr</small><p>سُبْحَانَ ٱللَّٰهِ</p><div class="meaning">Glory be to Allah</div></div><button class="count" type="button" aria-label="Tasbih count">0</button></section>
   <div class="toast" aria-live="polite"></div>
  </main>
  <nav class="nav" aria-label="Main navigation"><button class="active" type="button"><i data-lucide="house" aria-hidden="true"></i>Home</button><button type="button"><i data-lucide="clock-3" aria-hidden="true"></i>Prayer</button><button type="button"><i data-lucide="layout-grid" aria-hidden="true"></i>Explore</button><button type="button"><i data-lucide="compass" aria-hidden="true"></i>Qibla</button><button type="button"><i data-lucide="user-round" aria-hidden="true"></i>Profile</button></nav>
 </section>
</div>
<script>
(()=>{const root=document.getElementById('ib-home');const toast=root.querySelector('.toast');const count=root.querySelector('.count');const state={accent:'#176b5b',showDhikr:true,heroRadius:24};root.querySelectorAll('.quick button').forEach(button=>button.addEventListener('click',()=>{toast.textContent=`Opening ${button.dataset.name}`;}));count.addEventListener('click',()=>{count.textContent=String(Number(count.textContent)+1)});root.querySelectorAll('.nav button').forEach(button=>button.addEventListener('click',()=>{root.querySelectorAll('.nav button').forEach(item=>item.classList.toggle('active',item===button));toast.textContent=`${button.textContent.trim()} selected`;}));function render(){root.style.setProperty('--h-accent',state.accent);root.querySelector('.dhikr').style.display=state.showDhikr?'flex':'none';root.querySelector('.hero').style.borderRadius=`${state.heroRadius}px`}render();if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:render});tweak.addColorPicker(state,'accent',{label:'Brand accent',reference:'--h-accent'});tweak.addToggle(state,'showDhikr',{label:'Daily remembrance',reference:'dhikr.visible'});tweak.addSlider(state,'heroRadius',{label:'Prayer card radius',min:12,max:32,unit:'px',reference:'hero.radius'})}})();
</script>
