<style>
#ram-cal{--c-bg:light-dark(#f4f1e8,#0d2724);--c-surface:light-dark(#fffdf7,#14332f);--c-text:light-dark(#18332f,#f7f1df);--c-muted:light-dark(#687873,#b6c6bf);--c-accent:light-dark(#176b5b,#77c7ad);--c-accent-text:light-dark(#fff,#09231f);--c-gold:light-dark(#b58b3b,#d8b768);--c-line:light-dark(rgba(23,107,91,.14),rgba(119,199,173,.18));font-family:Inter,system-ui,sans-serif;color:var(--c-text);display:grid;place-items:center;padding:12px}#ram-cal *{box-sizing:border-box}#ram-cal .device{width:min(100%,390px);background:var(--c-bg);border:1px solid var(--c-line);border-radius:34px;overflow:hidden;box-shadow:0 22px 70px rgba(0,0,0,.16)}#ram-cal .status{display:flex;justify-content:space-between;padding:18px 22px 7px;font-size:12px;font-weight:500}#ram-cal .sys{display:flex;gap:8px}#ram-cal .sys i{width:14px;height:14px}#ram-cal .content{padding:12px 18px 22px}#ram-cal .head{display:grid;grid-template-columns:44px 1fr 44px;align-items:center}#ram-cal h1{text-align:center;font-size:20px;font-weight:500;margin:0}#ram-cal .iconbtn{width:44px;height:44px;border:0;background:transparent;color:var(--c-text);display:grid;place-items:center;cursor:pointer}#ram-cal .iconbtn i{width:19px;height:19px}#ram-cal .place{text-align:center;color:var(--c-muted);font-size:10px;margin:9px 0 17px}
#ram-cal .summary{background:var(--c-accent);color:var(--c-accent-text);border-radius:21px;padding:15px 16px;margin-bottom:17px;display:flex;justify-content:space-between;align-items:center}#ram-cal .summary small{font-size:10px;opacity:.75}#ram-cal .summary strong{display:block;font-size:18px;font-weight:500;margin-top:4px}#ram-cal .ring{width:48px;height:48px;border-radius:50%;border:5px solid color-mix(in srgb,var(--c-accent-text) 20%,transparent);border-top-color:var(--c-accent-text);display:grid;place-items:center;font-size:10px}
#ram-cal .legend{display:flex;gap:14px;color:var(--c-muted);font-size:9px;margin:0 2px 12px}#ram-cal .legend span{display:flex;align-items:center;gap:5px}#ram-cal .dot{width:7px;height:7px;border-radius:50%;background:var(--c-line)}#ram-cal .dot.done{background:var(--c-accent)}#ram-cal .dot.missed{background:var(--c-gold)}
#ram-cal .table{background:var(--c-surface);border-radius:19px;overflow:hidden}#ram-cal .thead,#ram-cal .day{display:grid;grid-template-columns:46px 1fr 1fr 36px;align-items:center;padding:0 12px}#ram-cal .thead{height:36px;color:var(--c-muted);font-size:9px;border-bottom:1px solid var(--c-line)}#ram-cal .day{min-height:52px;border-bottom:1px solid var(--c-line);font-size:11px;cursor:pointer}#ram-cal .day:last-child{border-bottom:0}#ram-cal .day strong{font-weight:500}#ram-cal .day small{display:block;color:var(--c-muted);font-size:8px;margin-top:2px}#ram-cal .day.selected{background:color-mix(in srgb,var(--c-accent) 8%,var(--c-surface))}#ram-cal .state{width:28px;height:28px;border:0;border-radius:10px;background:var(--c-line);color:var(--c-muted);display:grid;place-items:center;cursor:pointer}#ram-cal .state i{width:14px;height:14px}#ram-cal .state.done{background:color-mix(in srgb,var(--c-accent) 13%,var(--c-surface));color:var(--c-accent)}#ram-cal .state.missed{background:color-mix(in srgb,var(--c-gold) 14%,var(--c-surface));color:var(--c-gold)}
#ram-cal .detail{margin-top:14px;background:var(--c-surface);border-radius:17px;padding:13px 14px;display:flex;justify-content:space-between;align-items:center}#ram-cal .detail strong{font-size:12px;font-weight:500}#ram-cal .detail small{display:block;color:var(--c-muted);font-size:9px;margin-top:4px}#ram-cal .detail button{border:0;background:transparent;color:var(--c-accent);font:inherit;font-size:10px;cursor:pointer}#ram-cal .toast{height:18px;text-align:center;color:var(--c-muted);font-size:10px;padding-top:5px}@media(max-width:420px){#ram-cal{padding:0}#ram-cal .device{border-radius:26px}#ram-cal .content{padding-left:15px;padding-right:15px}}
</style>
<div id="ram-cal" aria-label="Ibadati Ramadan calendar preview"><section class="device"><div class="status"><span>9:41</span><span class="sys"><i data-lucide="signal" aria-hidden="true"></i><i data-lucide="wifi" aria-hidden="true"></i><i data-lucide="battery-full" aria-hidden="true"></i></span></div><main class="content"><header class="head"><button class="iconbtn" type="button" aria-label="Back"><i data-lucide="arrow-left" aria-hidden="true"></i></button><h1>Ramadan calendar</h1><button class="iconbtn" type="button" aria-label="Share calendar"><i data-lucide="share-2" aria-hidden="true"></i></button></header><div class="place">New Delhi · 1448 AH</div><section class="summary"><div><small>Your Ramadan</small><strong><span class="total">11</span> fasts completed</strong></div><span class="ring">37%</span></section><div class="legend"><span><i class="dot done"></i>Completed</span><span><i class="dot missed"></i>Missed</span><span><i class="dot"></i>Upcoming</span></div><div class="table"><div class="thead"><span>Day</span><span>Suhoor</span><span>Iftar</span><span></span></div><div class="day"><span><strong>8</strong><small>Sun</small></span><span>5:06 AM</span><span>6:38 PM</span><button class="state done" type="button" aria-label="Change day 8 status"><i data-lucide="check" aria-hidden="true"></i></button></div><div class="day"><span><strong>9</strong><small>Mon</small></span><span>5:05 AM</span><span>6:39 PM</span><button class="state done" type="button" aria-label="Change day 9 status"><i data-lucide="check" aria-hidden="true"></i></button></div><div class="day"><span><strong>10</strong><small>Tue</small></span><span>5:04 AM</span><span>6:40 PM</span><button class="state done" type="button" aria-label="Change day 10 status"><i data-lucide="check" aria-hidden="true"></i></button></div><div class="day selected"><span><strong>11</strong><small>Today</small></span><span>5:02 AM</span><span>6:41 PM</span><button class="state done" type="button" aria-label="Change day 11 status"><i data-lucide="check" aria-hidden="true"></i></button></div><div class="day"><span><strong>12</strong><small>Thu</small></span><span>5:01 AM</span><span>6:42 PM</span><button class="state" type="button" aria-label="Change day 12 status"><i data-lucide="minus" aria-hidden="true"></i></button></div><div class="day"><span><strong>13</strong><small>Fri</small></span><span>4:59 AM</span><span>6:43 PM</span><button class="state" type="button" aria-label="Change day 13 status"><i data-lucide="minus" aria-hidden="true"></i></button></div><div class="day"><span><strong>14</strong><small>Sat</small></span><span>4:58 AM</span><span>6:44 PM</span><button class="state" type="button" aria-label="Change day 14 status"><i data-lucide="minus" aria-hidden="true"></i></button></div></div><section class="detail"><div><strong>Day 11 · Today</strong><small>Fasting duration 13h 39m</small></div><button type="button">View duas</button></section><div class="toast" aria-live="polite"></div></main></section></div>
<script>
(()=>{const root=document.getElementById('ram-cal');const state={accent:'#176b5b',showLegend:true,tableRadius:19};const toast=root.querySelector('.toast');root.querySelectorAll('.state').forEach(button=>button.addEventListener('click',()=>{const current=button.classList.contains('done')?'done':button.classList.contains('missed')?'missed':'upcoming';const next=current==='upcoming'?'done':current==='done'?'missed':'upcoming';button.className=`state ${next==='upcoming'?'':next}`;button.innerHTML=`<i data-lucide="${next==='done'?'check':next==='missed'?'x':'minus'}" aria-hidden="true"></i>`;toast.textContent=`Fast marked ${next}`;if(globalThis.lucide)lucide.createIcons({attrs:{width:16,height:16}})}));function render(){root.style.setProperty('--c-accent',state.accent);root.querySelector('.legend').style.display=state.showLegend?'flex':'none';root.querySelector('.table').style.borderRadius=`${state.tableRadius}px`}render();if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:render});tweak.addColorPicker(state,'accent',{label:'Brand accent',reference:'--c-accent'});tweak.addToggle(state,'showLegend',{label:'Status legend',reference:'legend.visible'});tweak.addSlider(state,'tableRadius',{label:'Calendar radius',min:10,max:26,unit:'px',reference:'calendar.radius'})}})();
</script>
