<div id="ibadati-saved-empty" aria-label="Ibadati saved empty state">
  <style>
    #ibadati-saved-empty { --se-teal:#11766f; --se-gold:#ba8747; --se-ink:light-dark(#183731,#e5f4ed); --se-muted:light-dark(#657a73,#a9c0b8); --se-page:light-dark(#f4f1e9,#102722); --se-card:light-dark(#fffdf9,#17342e); --se-soft:light-dark(#e9f3ee,#20453d); --se-line:light-dark(#d7e1d9,#2a5148); max-width:390px; margin:0 auto; color:var(--se-ink); font-family:Inter,ui-sans-serif,system-ui,sans-serif; }
    #ibadati-saved-empty * { box-sizing:border-box; }
    #ibadati-saved-empty .se-phone { min-height:605px; overflow:hidden; border-radius:30px; background:var(--se-page); box-shadow:0 16px 40px light-dark(#50645b33,#0008); }
    #ibadati-saved-empty .se-top { padding:20px; color:#f8fffb; background:linear-gradient(145deg,var(--se-teal),#0a4e4a); }
    #ibadati-saved-empty .se-back { width:38px; height:38px; display:grid; place-items:center; border:0; border-radius:12px; background:#ffffff24; color:inherit; cursor:pointer; }
    #ibadati-saved-empty h1 { margin:17px 0 4px; font-size:22px; font-weight:500; letter-spacing:-.02em; }
    #ibadati-saved-empty .se-top p { margin:0; color:#d5ede5; font-size:13px; }
    #ibadati-saved-empty .se-content { padding:52px 20px 25px; text-align:center; }
    #ibadati-saved-empty .se-illustration { position:relative; width:118px; height:104px; margin:0 auto 22px; }
    #ibadati-saved-empty .se-circle { position:absolute; width:82px; height:82px; left:18px; top:9px; border-radius:28px; color:var(--se-teal); background:var(--se-soft); display:grid; place-items:center; }
    #ibadati-saved-empty .se-bookmark { position:absolute; right:6px; top:0; width:35px; height:45px; display:grid; place-items:center; border-radius:12px 12px 8px 8px; color:#fff; background:var(--se-gold); }
    #ibadati-saved-empty .se-content h2 { margin:0; font-size:20px; font-weight:500; }
    #ibadati-saved-empty .se-copy { max-width:276px; margin:9px auto 22px; color:var(--se-muted); font-size:12px; }
    #ibadati-saved-empty .se-primary { width:100%; padding:12px; border:0; border-radius:13px; color:#fff; background:var(--se-teal); font:500 13px inherit; cursor:pointer; }
    #ibadati-saved-empty .se-hint { margin-top:17px; padding:13px; border:1px solid var(--se-line); border-radius:16px; background:var(--se-card); text-align:left; }
    #ibadati-saved-empty .se-hint-top { display:flex; gap:9px; align-items:flex-start; }
    #ibadati-saved-empty .se-hint-icon { width:31px; height:31px; flex:0 0 auto; display:grid; place-items:center; border-radius:10px; color:var(--se-gold); background:#f6ebd8; }
    #ibadati-saved-empty .se-hint b { display:block; font-size:12px; font-weight:500; }
    #ibadati-saved-empty .se-hint span { display:block; margin-top:3px; color:var(--se-muted); font-size:11px; }
    #ibadati-saved-empty .se-note { display:none; margin:11px 0 0; padding-top:10px; border-top:1px solid var(--se-line); color:var(--se-teal); font-size:11px; }
    #ibadati-saved-empty .se-note.show { display:block; }
    #ibadati-saved-empty [data-lucide] { width:23px; height:23px; stroke-width:1.8; }
  </style>
  <main class="se-phone"><header class="se-top"><button class="se-back" type="button" aria-label="Back"><i data-lucide="arrow-left" aria-hidden="true"></i></button><h1>Saved</h1><p>आपकी पसंदीदा इबादतें एक जगह</p></header><section class="se-content" aria-live="polite"><div class="se-illustration"><div class="se-circle"><i data-lucide="book-open-heart" aria-hidden="true"></i></div><div class="se-bookmark"><i data-lucide="bookmark" aria-hidden="true"></i></div></div><h2>Nothing saved yet</h2><p class="se-copy">दुआ, अज़कार या कोई helpful page save करें—वह यहाँ offline भी जल्दी मिल जाएगा।</p><button class="se-primary" id="se-explore" type="button">Explore duas &amp; azkar</button><article class="se-hint"><div class="se-hint-top"><div class="se-hint-icon"><i data-lucide="bookmark-plus" aria-hidden="true"></i></div><div><b>How to save</b><span>किसी page पर bookmark icon दबाएँ</span></div></div><p class="se-note" id="se-note">Explore section खुलने के लिए तैयार है।</p></article></section></main>
  <script>
    (()=>{const root=document.getElementById('ibadati-saved-empty');const state={accent:'#11766f',radius:16,showHint:false};function render(){root.style.setProperty('--se-teal',state.accent);root.querySelector('.se-circle').style.borderRadius=`${state.radius+12}px`;root.querySelector('.se-hint').style.borderRadius=`${state.radius}px`;root.querySelector('#se-note').classList.toggle('show',state.showHint);}root.querySelector('#se-explore').addEventListener('click',()=>{state.showHint=true;render();});render();if(globalThis.lucide)globalThis.lucide.createIcons({attrs:{width:23,height:23}});if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:render});tweak.addColorPicker(state,'accent',{label:'Accent colour',reference:'--se-teal'});tweak.addSlider(state,'radius',{label:'Card radius',min:12,max:25,unit:'px'});tweak.addToggle(state,'showHint',{label:'Show explore state'});}})();
  </script>
</div>
