<div id="ibadati-appearance" aria-label="Ibadati appearance and reading settings">
<style>#ibadati-appearance{--ap-accent:#0f766e;--ap-bg:light-dark(#f4f0e7,#101917);--ap-surface:light-dark(#fffdf8,#182421);--ap-soft:light-dark(#e4f0ec,#203630);--ap-text:light-dark(#18312d,#edf7f4);--ap-muted:light-dark(#687773,#adbfba);--ap-line:light-dark(#dce4df,#31423d);color-scheme:light dark;color:var(--ap-text);font-family:Inter,ui-sans-serif,system-ui,sans-serif;max-width:430px;margin:auto}#ibadati-appearance *{box-sizing:border-box}#ibadati-appearance .ap-phone{background:var(--ap-bg);border-radius:28px;overflow:hidden;box-shadow:0 16px 44px light-dark(#143d3524,#00000055)}#ibadati-appearance .ap-head{padding:18px;background:var(--ap-surface);display:flex;align-items:center;gap:12px}#ibadati-appearance .ap-back{width:44px;height:44px;border:0;border-radius:50%;background:var(--ap-soft);color:var(--ap-text);display:grid;place-items:center}#ibadati-appearance h2,#ibadati-appearance p{margin:0}#ibadati-appearance h2{font-size:20px;font-weight:500}#ibadati-appearance .ap-sub{font-size:13px;color:var(--ap-muted);margin-top:3px}#ibadati-appearance .ap-main{padding:18px}#ibadati-appearance .ap-label{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ap-muted);margin:0 0 8px 4px}#ibadati-appearance .ap-themes{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}#ibadati-appearance .ap-theme{min-height:94px;border:1px solid transparent;border-radius:17px;background:var(--ap-surface);color:var(--ap-text);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;font-size:12px}#ibadati-appearance .ap-theme[aria-pressed="true"]{border-color:var(--ap-accent);background:var(--ap-soft);color:var(--ap-accent)}#ibadati-appearance .ap-list{background:var(--ap-surface);border-radius:19px;overflow:hidden;margin-top:20px}#ibadati-appearance .ap-row{min-height:64px;padding:10px 14px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--ap-line)}#ibadati-appearance .ap-row:last-child{border-bottom:0}#ibadati-appearance .ap-row>i{color:var(--ap-accent)}#ibadati-appearance .ap-copy{flex:1}#ibadati-appearance .ap-copy strong{font-size:14px;font-weight:500}#ibadati-appearance .ap-copy p{font-size:11px;color:var(--ap-muted);margin-top:3px}#ibadati-appearance select{min-height:40px;max-width:135px;border:0;background:transparent;color:var(--ap-text);font:inherit;text-align:right}#ibadati-appearance .ap-size{display:flex;align-items:center;gap:8px}#ibadati-appearance .ap-step{width:40px;height:40px;border:0;border-radius:12px;background:var(--ap-soft);color:var(--ap-accent)}#ibadati-appearance .ap-size b{width:30px;text-align:center;font-size:13px}#ibadati-appearance .ap-switch{width:50px;height:30px;border:0;border-radius:99px;background:var(--ap-soft);padding:4px}#ibadati-appearance .ap-switch span{display:block;width:22px;height:22px;border-radius:50%;background:var(--ap-muted);transition:margin .2s}#ibadati-appearance .ap-switch[aria-pressed="true"]{background:var(--ap-accent)}#ibadati-appearance .ap-switch[aria-pressed="true"] span{margin-left:auto;background:#fff}#ibadati-appearance .ap-preview{margin-top:18px;background:var(--ap-surface);border-radius:21px;padding:18px}#ibadati-appearance .ap-preview-label{font-size:11px;color:var(--ap-muted)}#ibadati-appearance .ap-arabic{font-family:"Noto Naskh Arabic",serif;font-size:29px;line-height:1.8;text-align:right;direction:rtl;margin-top:10px}#ibadati-appearance .ap-meaning{font-size:14px;line-height:1.55;color:var(--ap-muted);margin-top:8px}#ibadati-appearance .ap-save{width:100%;min-height:50px;border:0;border-radius:15px;background:var(--ap-accent);color:#fff;font-size:16px;font-weight:500;margin-top:17px}#ibadati-appearance .ap-status{text-align:center;color:var(--ap-accent);font-size:12px;min-height:18px;margin-top:9px}@media(max-width:350px){#ibadati-appearance .ap-head,#ibadati-appearance .ap-main{padding-left:14px;padding-right:14px}}</style>
<section class="ap-phone"><header class="ap-head"><button class="ap-back" type="button" aria-label="Go back"><i data-lucide="arrow-left" aria-hidden="true"></i></button><div><h2>Appearance &amp; reading</h2><p class="ap-sub">Comfortable in every light and language</p></div></header><main class="ap-main"><p class="ap-label">App theme</p><div class="ap-themes" role="group" aria-label="App theme"><button class="ap-theme" type="button" aria-pressed="true" data-theme="System"><i data-lucide="smartphone" aria-hidden="true"></i>System</button><button class="ap-theme" type="button" aria-pressed="false" data-theme="Light"><i data-lucide="sun" aria-hidden="true"></i>Light</button><button class="ap-theme" type="button" aria-pressed="false" data-theme="Dark"><i data-lucide="moon" aria-hidden="true"></i>Dark</button></div><section class="ap-list"><div class="ap-row"><i data-lucide="languages" aria-hidden="true"></i><div class="ap-copy"><strong>Arabic font</strong><p>Used in duas and azkar</p></div><select id="ap-font" aria-label="Arabic font"><option>Naskh</option><option>Uthmani</option><option>IndoPak</option></select></div><div class="ap-row"><i data-lucide="type" aria-hidden="true"></i><div class="ap-copy"><strong>Reading size</strong><p>Arabic and translation text</p></div><div class="ap-size"><button class="ap-step" id="ap-minus" type="button" aria-label="Decrease text size">A−</button><b id="ap-size">100%</b><button class="ap-step" id="ap-plus" type="button" aria-label="Increase text size">A+</button></div></div><div class="ap-row"><i data-lucide="contrast" aria-hidden="true"></i><div class="ap-copy"><strong>High contrast</strong><p>Strengthen text and controls</p></div><button class="ap-switch" id="ap-contrast" type="button" role="switch" aria-checked="false" aria-pressed="false" aria-label="High contrast"><span></span></button></div></section><section class="ap-preview"><p class="ap-preview-label">Live preview</p><p class="ap-arabic" id="ap-arabic" lang="ar">سُبْحَانَ اللَّهِ وَبِحَمْدِهِ</p><p class="ap-meaning" id="ap-meaning">Glory is to Allah and praise is to Him.</p></section><button class="ap-save" id="ap-save" type="button">Save appearance</button><p class="ap-status" id="ap-status" aria-live="polite"></p></main></section>
<script>(()=>{const root=document.getElementById('ibadati-appearance');const themes=[...root.querySelectorAll('.ap-theme')];const arabic=root.querySelector('#ap-arabic');const meaning=root.querySelector('#ap-meaning');const sizeLabel=root.querySelector('#ap-size');const status=root.querySelector('#ap-status');let size=100;const updateSize=()=>{sizeLabel.textContent=`${size}%`;arabic.style.fontSize=`${29*size/100}px`;meaning.style.fontSize=`${14*size/100}px`};themes.forEach(button=>button.addEventListener('click',()=>{themes.forEach(item=>item.setAttribute('aria-pressed',String(item===button)));status.textContent=`${button.dataset.theme} theme selected.`}));root.querySelector('#ap-minus').addEventListener('click',()=>{size=Math.max(80,size-10);updateSize()});root.querySelector('#ap-plus').addEventListener('click',()=>{size=Math.min(140,size+10);updateSize()});root.querySelector('#ap-font').addEventListener('change',event=>{arabic.style.fontFamily=event.target.value==='IndoPak'?'serif':'Noto Naskh Arabic, serif'});const contrast=root.querySelector('#ap-contrast');contrast.addEventListener('click',()=>{const on=contrast.getAttribute('aria-pressed')!=='true';contrast.setAttribute('aria-pressed',String(on));contrast.setAttribute('aria-checked',String(on));root.style.fontWeight=on?'500':'400'});root.querySelector('#ap-save').addEventListener('click',()=>{status.textContent='Appearance preferences saved.'});const state={accent:'#0f766e',previewRadius:21,showPreview:true};const preview=root.querySelector('.ap-preview');function render(){root.style.setProperty('--ap-accent',state.accent);preview.style.borderRadius=`${state.previewRadius}px`;preview.hidden=!state.showPreview}render();updateSize();if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:render});tweak.addColorPicker(state,'accent',{label:'Accent color',reference:'--ap-accent'});tweak.addSlider(state,'previewRadius',{label:'Preview radius',min:10,max:30,unit:'px',reference:'appearance.preview'});tweak.addToggle(state,'showPreview',{label:'Show preview',reference:'appearance.live'})}})();</script>
</div>
