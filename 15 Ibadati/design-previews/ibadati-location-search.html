  <style>
    #ibadati-location-search{--ls-accent:#0f766e;--ls-gold:#b8893d;--ls-bg:light-dark(#f4f0e7,#101917);--ls-surface:light-dark(#fffdf8,#182421);--ls-soft:light-dark(#e4f0ec,#203630);--ls-text:light-dark(#18312d,#edf7f4);--ls-muted:light-dark(#687773,#adbfba);--ls-line:light-dark(#dce4df,#31423d);color-scheme:light dark;color:var(--ls-text);font-family:Inter,ui-sans-serif,system-ui,sans-serif;max-width:430px;margin:0 auto}#ibadati-location-search *{box-sizing:border-box}
