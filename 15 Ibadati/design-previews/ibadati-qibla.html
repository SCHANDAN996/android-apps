<style>
#qibla-screen{--q-bg:light-dark(#f4f1e8,#0d2724);--q-surface:light-dark(#fffdf7,#14332f);--q-text:light-dark(#18332f,#f7f1df);--q-muted:light-dark(#687873,#b6c6bf);--q-accent:light-dark(#176b5b,#77c7ad);--q-accent-text:light-dark(#fff,#09231f);--q-gold:light-dark(#b58b3b,#d8b768);--q-line:light-dark(rgba(23,107,91,.16),rgba(119,199,173,.18));font-family:Inter,system-ui,sans-serif;color:var(--q-text);display:grid;place-items:center;padding:12px}
#qibla-screen *{box-sizing:border-box}#qibla-screen .device{width:min(100%,390px);background:var(--q-bg);border:1px solid var(--q-line);border-radius:34px;overflow:hidden;box-shadow:0 22px 70px rgba(0,0,0,.16)}#qibla-screen .status{display:flex;justify-content:space-between;padding:18px 22px 7px;font-size:12px;font-weight:500}#qibla-screen .sys{display:flex;gap:8px}#qibla-screen .sys i{width:14px;height:14px}
#qibla-screen .content{padding:12px 20px 0}#qibla-screen .head{display:flex;align-items:center;justify-content:space-between}#qibla-screen h1{font-size:24px;font-weight:500;margin:0}#qibla-screen .iconbtn{width:44px;height:44px;border:0;background:transparent;color:var(--q-text);display:grid;place-items:center;cursor:pointer}#qibla-screen .iconbtn i{width:20px;height:20px}#qibla-screen .place{text-align:center;color:var(--q-muted);font-size:11px;margin:8px 0 18px}
#qibla-screen .bearing{text-align:center}#qibla-screen .bearing strong{display:block;font-size:28px;font-weight:500;letter-spacing:-.02em}#qibla-screen .bearing span{display:block;color:var(--q-muted);font-size:12px;margin-top:4px}
#qibla-screen .compass-wrap{height:330px;display:grid;place-items:center;position:relative}#qibla-screen .compass{width:276px;height:276px;border-radius:50%;position:relative;background:var(--q-surface);box-shadow:inset 0 0 0 1px var(--q-line),0 20px 50px color-mix(in srgb,var(--q-accent) 10%,transparent);transition:transform .5s ease}#qibla-screen .compass:before{content:"";position:absolute;inset:29px;border-radius:50%;border:1px solid var(--q-line)}#qibla-screen .cardinal{position:absolute;font-size:12px;font-weight:500;color:var(--q-muted)}#qibla-screen .north{top:14px;left:50%;transform:translateX(-50%);color:var(--q-gold)}#qibla-screen .south{bottom:14px;left:50%;transform:translateX(-50%)}#qibla-screen .east{right:15px;top:50%;transform:translateY(-50%)}#qibla-screen .west{left:15px;top:50%;transform:translateY(-50%)}
#qibla-screen .needle{position:absolute;left:50%;top:50%;width:4px;height:184px;transform:translate(-50%,-50%) rotate(266deg);transition:transform .5s ease}#qibla-screen .needle:before{content:"";position:absolute;left:-7px;top:0;border-left:9px solid transparent;border-right:9px solid transparent;border-bottom:80px solid var(--q-gold);transform:rotate(180deg);transform-origin:50% 100%}#qibla-screen .needle:after{content:"";position:absolute;left:-5px;bottom:0;border-left:7px solid transparent;border-right:7px solid transparent;border-top:72px solid color-mix(in srgb,var(--q-accent) 45%,var(--q-surface))}#qibla-screen .hub{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:54px;height:54px;border-radius:18px;background:var(--q-accent);color:var(--q-accent-text);display:grid;place-items:center;box-shadow:0 9px 25px color-mix(in srgb,var(--q-accent) 28%,transparent);z-index:2}#qibla-screen .hub i{width:25px;height:25px}
#qibla-screen .aligned{position:absolute;top:7px;left:50%;transform:translateX(-50%);background:color-mix(in srgb,var(--q-accent) 12%,var(--q-surface));color:var(--q-accent);font-size:11px;border-radius:99px;padding:7px 11px;display:none;align-items:center;gap:5px}#qibla-screen .aligned i{width:14px;height:14px}
#qibla-screen .stats{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:14px}#qibla-screen .stat{background:var(--q-surface);border-radius:17px;padding:13px 14px}#qibla-screen .stat small{display:block;color:var(--q-muted);font-size:10px}#qibla-screen .stat strong{display:block;font-size:14px;font-weight:500;margin-top:5px}#qibla-screen .accuracy{display:flex;align-items:center;justify-content:center;gap:6px;color:var(--q-muted);font-size:11px;margin-bottom:12px}#qibla-screen .dot{width:7px;height:7px;border-radius:50%;background:var(--q-accent)}#qibla-screen .hint{text-align:center;min-height:18px;color:var(--q-muted);font-size:11px}
#qibla-screen .nav{background:var(--q-surface);padding:9px 10px 14px;display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--q-line)}#qibla-screen .nav button{min-height:45px;border:0;background:transparent;color:var(--q-muted);font:inherit;font-size:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer}#qibla-screen .nav i{width:19px;height:19px}#qibla-screen .nav .active{color:var(--q-accent)}
@media(max-width:420px){#qibla-screen{padding:0}#qibla-screen .device{border-radius:26px}#qibla-screen .compass-wrap{height:310px}#qibla-screen .compass{width:258px;height:258px}}
@media(prefers-reduced-motion:reduce){#qibla-screen .needle{transition:none}}
</style>
<div id="qibla-screen" aria-label="Ibadati Qibla compass preview">
 <section class="device">
  <div class="status"><span>9:41</span><span class="sys"><i data-lucide="signal" aria-hidden="true"></i><i data-lucide="wifi" aria-hidden="true"></i><i data-lucide="battery-full" aria-hidden="true"></i></span></div>
  <main class="content">
   <header class="head"><button class="iconbtn" type="button" aria-label="Qibla information"><i data-lucide="circle-help" aria-hidden="true"></i></button><h1>Qibla</h1><button class="iconbtn calibrate" type="button" aria-label="Calibrate compass"><i data-lucide="refresh-cw" aria-hidden="true"></i></button></header>
   <div class="place"><i data-lucide="map-pin" aria-hidden="true" style="width:11px;height:11px;vertical-align:-2px"></i> New Delhi, India</div>
   <div class="bearing"><strong>266° W</strong><span>Direction to the Kaaba</span></div>
   <div class="compass-wrap"><div class="aligned"><i data-lucide="check-circle-2" aria-hidden="true"></i>Aligned with Qibla</div><div class="compass"><span class="cardinal north">N</span><span class="cardinal east">E</span><span class="cardinal south">S</span><span class="cardinal west">W</span><div class="needle"></div><span class="hub"><i data-lucide="landmark" aria-hidden="true"></i></span></div></div>
   <div class="stats"><div class="stat"><small>Distance to Kaaba</small><strong>3,830 km</strong></div><div class="stat"><small>Current heading</small><strong class="heading">214° SW</strong></div></div>
   <div class="accuracy"><span class="dot"></span>Compass accuracy: Good</div><div class="hint" aria-live="polite">Place your phone flat and move away from metal objects</div>
  </main>
  <nav class="nav" aria-label="Main navigation"><button type="button"><i data-lucide="house" aria-hidden="true"></i>Home</button><button type="button"><i data-lucide="clock-3" aria-hidden="true"></i>Prayer</button><button type="button"><i data-lucide="layout-grid" aria-hidden="true"></i>Explore</button><button class="active" type="button"><i data-lucide="compass" aria-hidden="true"></i>Qibla</button><button type="button"><i data-lucide="user-round" aria-hidden="true"></i>Profile</button></nav>
 </section>
</div>
<script>
(()=>{const root=document.getElementById('qibla-screen');const state={accent:'#176b5b',compassSize:276,showStats:true};let aligned=false;root.querySelector('.calibrate').addEventListener('click',()=>{aligned=!aligned;root.querySelector('.needle').style.transform=`translate(-50%,-50%) rotate(${aligned?0:266}deg)`;root.querySelector('.heading').textContent=aligned?'266° W':'214° SW';root.querySelector('.aligned').style.display=aligned?'flex':'none';root.querySelector('.hint').textContent=aligned?'You are facing the Qibla':'Place your phone flat and move away from metal objects'});function render(){root.style.setProperty('--q-accent',state.accent);const compass=root.querySelector('.compass');compass.style.width=`${state.compassSize}px`;compass.style.height=`${state.compassSize}px`;root.querySelector('.stats').style.display=state.showStats?'grid':'none'}render();if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:render});tweak.addColorPicker(state,'accent',{label:'Brand accent',reference:'--q-accent'});tweak.addSlider(state,'compassSize',{label:'Compass size',min:230,max:290,unit:'px',reference:'compass.size'});tweak.addToggle(state,'showStats',{label:'Distance details',reference:'stats.visible'})}})();
</script>
