<style>
#dua-reader{--r-bg:light-dark(#f4f1e8,#0d2724);--r-surface:light-dark(#fffdf7,#14332f);--r-text:light-dark(#18332f,#f7f1df);--r-muted:light-dark(#687873,#b6c6bf);--r-accent:light-dark(#176b5b,#77c7ad);--r-accent-text:light-dark(#fff,#09231f);--r-gold:light-dark(#b58b3b,#d8b768);--r-line:light-dark(rgba(23,107,91,.14),rgba(119,199,173,.18));font-family:Inter,system-ui,sans-serif;color:var(--r-text);display:grid;place-items:center;padding:12px}
#dua-reader *{box-sizing:border-box}#dua-reader .device{width:min(100%,390px);background:var(--r-bg);border:1px solid var(--r-line);border-radius:34px;overflow:hidden;box-shadow:0 22px 70px rgba(0,0,0,.16)}#dua-reader .status{display:flex;justify-content:space-between;padding:18px 22px 7px;font-size:12px;font-weight:500}#dua-reader .sys{display:flex;gap:8px}#dua-reader .sys i{width:14px;height:14px}#dua-reader .content{padding:12px 19px 20px}
#dua-reader .head{display:grid;grid-template-columns:44px 1fr 88px;align-items:center}#dua-reader .head h1{text-align:center;font-size:18px;font-weight:500;margin:0}#dua-reader .actions{display:flex}#dua-reader .iconbtn{width:44px;height:44px;border:0;background:transparent;color:var(--r-text);display:grid;place-items:center;cursor:pointer}#dua-reader .iconbtn i{width:19px;height:19px}#dua-reader .iconbtn.saved{color:var(--r-gold)}
#dua-reader .meta{text-align:center;color:var(--r-muted);font-size:11px;margin:10px 0 18px}#dua-reader .arabic-card{background:var(--r-surface);border-radius:24px;padding:25px 20px 19px;text-align:center;position:relative;overflow:hidden}#dua-reader .arabic-card:before{content:"";position:absolute;width:120px;height:120px;border-radius:50%;right:-50px;top:-55px;border:1px solid var(--r-line);box-shadow:0 0 0 24px color-mix(in srgb,var(--r-accent) 3%,transparent)}#dua-reader .arabic{font-family:"Noto Naskh Arabic","Amiri",serif;font-size:36px;line-height:1.8;direction:rtl;margin:10px 0 20px;position:relative}#dua-reader .arabic-tools{display:flex;justify-content:center;gap:9px}#dua-reader .round{width:44px;height:44px;border:0;border-radius:15px;background:color-mix(in srgb,var(--r-accent) 10%,var(--r-surface));color:var(--r-accent);display:grid;place-items:center;cursor:pointer}#dua-reader .round i{width:18px;height:18px}#dua-reader .round.primary{background:var(--r-accent);color:var(--r-accent-text)}
#dua-reader .progress{height:3px;background:var(--r-line);border-radius:99px;margin:14px 6px 0;overflow:hidden}#dua-reader .bar{height:100%;width:0;background:var(--r-accent);transition:width .3s ease}#dua-reader .audio-time{display:flex;justify-content:space-between;color:var(--r-muted);font-size:10px;margin:5px 6px 0}
#dua-reader .block{padding:19px 2px;border-bottom:1px solid var(--r-line)}#dua-reader .block small{display:block;color:var(--r-gold);font-size:10px;text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px}#dua-reader .block p{font-size:14px;line-height:1.6;margin:0}#dua-reader .translation p{font-size:15px}#dua-reader .source{display:flex;gap:10px;align-items:flex-start;padding:15px;margin-top:17px;background:color-mix(in srgb,var(--r-accent) 8%,var(--r-surface));border-radius:17px}#dua-reader .source i{width:17px;height:17px;color:var(--r-accent);flex:0 0 auto}#dua-reader .source strong{display:block;font-size:11px;font-weight:500}#dua-reader .source span{display:block;color:var(--r-muted);font-size:10px;margin-top:4px;line-height:1.45}
#dua-reader .footer{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;margin-top:18px}#dua-reader .footer button{height:44px;border:0;background:transparent;color:var(--r-text);display:grid;place-items:center;cursor:pointer}#dua-reader .footer button i{width:19px;height:19px}#dua-reader .page{text-align:center;color:var(--r-muted);font-size:11px}#dua-reader .toast{text-align:center;height:18px;color:var(--r-muted);font-size:11px;margin-top:5px}
@media(max-width:420px){#dua-reader{padding:0}#dua-reader .device{border-radius:26px}#dua-reader .content{padding-left:15px;padding-right:15px}#dua-reader .arabic{font-size:32px}}
@media(prefers-reduced-motion:reduce){#dua-reader .bar{transition:none}}
</style>
<div id="dua-reader" aria-label="Ibadati dua reading screen preview">
 <section class="device"><div class="status"><span>9:41</span><span class="sys"><i data-lucide="signal" aria-hidden="true"></i><i data-lucide="wifi" aria-hidden="true"></i><i data-lucide="battery-full" aria-hidden="true"></i></span></div>
  <main class="content">
   <header class="head"><button class="iconbtn" type="button" aria-label="Back"><i data-lucide="arrow-left" aria-hidden="true"></i></button><h1>Before eating</h1><div class="actions"><button class="iconbtn save" type="button" aria-label="Save dua"><i data-lucide="bookmark" aria-hidden="true"></i></button><button class="iconbtn" type="button" aria-label="Share dua"><i data-lucide="share-2" aria-hidden="true"></i></button></div></header>
   <div class="meta">Daily life · Dua 1 of 8</div>
   <section class="arabic-card"><div class="arabic">بِسْمِ ٱللَّٰهِ</div><div class="arabic-tools"><button class="round minus" type="button" aria-label="Decrease Arabic size"><i data-lucide="minus" aria-hidden="true"></i></button><button class="round primary play" type="button" aria-label="Play recitation"><i data-lucide="play" aria-hidden="true"></i></button><button class="round plus" type="button" aria-label="Increase Arabic size"><i data-lucide="plus" aria-hidden="true"></i></button></div><div class="progress"><div class="bar"></div></div><div class="audio-time"><span>0:00</span><span>0:04</span></div></section>
   <section class="block"><small>Transliteration</small><p>Bismillāh</p></section><section class="block translation"><small>Meaning</small><p>In the name of Allah.</p></section>
   <section class="source"><i data-lucide="badge-check" aria-hidden="true"></i><div><strong>Source verified</strong><span>Sunan Abi Dawud 3767 · When beginning a meal</span></div></section>
   <div class="footer"><button type="button" aria-label="Previous dua"><i data-lucide="chevron-left" aria-hidden="true"></i></button><div class="page">1 / 8</div><button type="button" aria-label="Next dua"><i data-lucide="chevron-right" aria-hidden="true"></i></button></div><div class="toast" aria-live="polite"></div>
  </main>
 </section>
</div>
<script>
(()=>{const root=document.getElementById('dua-reader');const state={accent:'#176b5b',arabicSize:36,showSource:true};const arabic=root.querySelector('.arabic');const play=root.querySelector('.play');const toast=root.querySelector('.toast');let playing=false;root.querySelector('.plus').addEventListener('click',()=>{state.arabicSize=Math.min(48,state.arabicSize+2);render()});root.querySelector('.minus').addEventListener('click',()=>{state.arabicSize=Math.max(28,state.arabicSize-2);render()});root.querySelector('.save').addEventListener('click',event=>{event.currentTarget.classList.toggle('saved');toast.textContent=event.currentTarget.classList.contains('saved')?'Dua saved':'Removed from saved'});play.addEventListener('click',()=>{playing=!playing;play.innerHTML=`<i data-lucide="${playing?'pause':'play'}" aria-hidden="true"></i>`;root.querySelector('.bar').style.width=playing?'68%':'0';if(globalThis.lucide)lucide.createIcons({attrs:{width:16,height:16}})});function render(){root.style.setProperty('--r-accent',state.accent);arabic.style.fontSize=`${state.arabicSize}px`;root.querySelector('.source').style.display=state.showSource?'flex':'none'}render();if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:render});tweak.addColorPicker(state,'accent',{label:'Brand accent',reference:'--r-accent'});tweak.addSlider(state,'arabicSize',{label:'Arabic size',min:28,max:48,unit:'px',reference:'arabic.size'});tweak.addToggle(state,'showSource',{label:'Verified source',reference:'source.visible'})}})();
</script>
