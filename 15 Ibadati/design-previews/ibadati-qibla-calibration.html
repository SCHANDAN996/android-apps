<div id="ibadati-qibla-calibration" aria-label="Ibadati Qibla compass calibration">
<style>#ibadati-qibla-calibration{--qc-accent:#0f766e;--qc-gold:#b8893d;--qc-bg:light-dark(#f4f0e7,#101917);--qc-surface:light-dark(#fffdf8,#182421);--qc-soft:light-dark(#e4f0ec,#203630);--qc-text:light-dark(#18312d,#edf7f4);--qc-muted:light-dark(#687773,#adbfba);--qc-line:light-dark(#dce4df,#31423d);color-scheme:light dark;color:var(--qc-text);font-family:Inter,ui-sans-serif,system-ui,sans-serif;max-width:430px;margin:auto}#ibadati-qibla-calibration *{box-sizing:border-box}#ibadati-qibla-calibration .qc-phone{background:var(--qc-bg);border-radius:28px;overflow:hidden;box-shadow:0 16px 44px light-dark(#143d3524,#00000055)}#ibadati-qibla-calibration .qc-head{padding:18px;background:var(--qc-surface);display:flex;align-items:center;gap:12px}#ibadati-qibla-calibration .qc-back{width:44px;height:44px;border:0;border-radius:50%;background:var(--qc-soft);color:var(--qc-text);display:grid;place-items:center}#ibadati-qibla-calibration h2,#ibadati-qibla-calibration p{margin:0}#ibadati-qibla-calibration h2{font-size:20px;font-weight:500}#ibadati-qibla-calibration .qc-sub{font-size:13px;color:var(--qc-muted);margin-top:3px}#ibadati-qibla-calibration .qc-main{padding:18px;text-align:center}#ibadati-qibla-calibration .qc-status{display:inline-flex;align-items:center;gap:7px;padding:8px 12px;border-radius:99px;background:var(--qc-soft);color:var(--qc-gold);font-size:12px}#ibadati-qibla-calibration .qc-figure{height:270px;position:relative;display:grid;place-items:center;margin:12px 0}#ibadati-qibla-calibration .qc-loop{position:absolute;width:205px;height:105px;border:14px solid var(--qc-accent);border-radius:50%;transform:rotate(35deg);opacity:.85}#ibadati-qibla-calibration .qc-loop.second{transform:rotate(-35deg);border-color:var(--qc-gold);opacity:.65}#ibadati-qibla-calibration .qc-phone-icon{width:72px;height:128px;border:4px solid var(--qc-text);border-radius:16px;background:var(--qc-surface);display:grid;place-items:center;z-index:2;transform:rotate(-12deg);transition:transform .6s}#ibadati-qibla-calibration .qc-phone-icon i{color:var(--qc-accent);width:30px;height:30px}#ibadati-qibla-calibration .qc-dots{position:absolute;inset:0;pointer-events:none}#ibadati-qibla-calibration .qc-dots span{position:absolute;width:8px;height:8px;border-radius:50%;background:var(--qc-gold)}#ibadati-qibla-calibration .qc-dots span:nth-child(1){left:16%;top:34%}#ibadati-qibla-calibration .qc-dots span:nth-child(2){right:17%;top:28%}#ibadati-qibla-calibration .qc-dots span:nth-child(3){right:23%;bottom:24%}#ibadati-qibla-calibration .qc-instruction{font-size:17px;font-weight:500}#ibadati-qibla-calibration .qc-help{font-size:12px;line-height:1.55;color:var(--qc-muted);max-width:310px;margin:7px auto 0}#ibadati-qibla-calibration .qc-meter{background:var(--qc-surface);border-radius:18px;padding:15px;text-align:left;margin-top:20px}#ibadati-qibla-calibration .qc-meter-top{display:flex;justify-content:space-between;font-size:13px}#ibadati-qibla-calibration .qc-meter-top span{color:var(--qc-gold)}#ibadati-qibla-calibration .qc-track{height:7px;border-radius:99px;background:var(--qc-soft);overflow:hidden;margin-top:10px}#ibadati-qibla-calibration .qc-fill{height:100%;width:28%;background:var(--qc-gold);border-radius:99px;transition:width .6s}#ibadati-qibla-calibration .qc-tip{display:flex;gap:10px;text-align:left;padding:15px 8px;color:var(--qc-muted);font-size:11px;line-height:1.5}#ibadati-qibla-calibration .qc-tip i{color:var(--qc-gold);flex:0 0 auto}#ibadati-qibla-calibration .qc-action{width:100%;min-height:50px;border:0;border-radius:15px;background:var(--qc-accent);color:#fff;font-size:16px;font-weight:500}#ibadati-qibla-calibration .qc-message{font-size:12px;color:var(--qc-accent);min-height:18px;margin-top:10px}@media(prefers-reduced-motion:reduce){#ibadati-qibla-calibration .qc-phone-icon,#ibadati-qibla-calibration .qc-fill{transition:none}}@media(max-width:350px){#ibadati-qibla-calibration .qc-head,#ibadati-qibla-calibration .qc-main{padding-left:14px;padding-right:14px}}</style>
<section class="qc-phone"><header class="qc-head"><button class="qc-back" type="button" aria-label="Go back"><i data-lucide="arrow-left" aria-hidden="true"></i></button><div><h2>Calibrate compass</h2><p class="qc-sub">Improve Qibla direction accuracy</p></div></header><main class="qc-main"><div class="qc-status" id="qc-status"><i data-lucide="triangle-alert" aria-hidden="true"></i><span>Low accuracy</span></div><div class="qc-figure" aria-label="Move your phone in a figure eight"><div class="qc-loop"></div><div class="qc-loop second"></div><div class="qc-phone-icon" id="qc-phone-icon"><i data-lucide="smartphone" aria-hidden="true"></i></div><div class="qc-dots"><span></span><span></span><span></span></div></div><p class="qc-instruction">Move your phone in a figure 8</p><p class="qc-help">Tilt and rotate it slowly through several directions until accuracy improves.</p><section class="qc-meter"><div class="qc-meter-top"><strong>Compass accuracy</strong><span id="qc-level">Low · 28%</span></div><div class="qc-track"><div class="qc-fill" id="qc-fill"></div></div></section><div class="qc-tip"><i data-lucide="magnet" aria-hidden="true"></i><p>Move away from metal furniture, speakers, chargers or magnetic phone cases.</p></div><button class="qc-action" id="qc-action" type="button">Simulate calibration</button><p class="qc-message" id="qc-message" aria-live="polite"></p></main></section>
<script>(()=>{const root=document.getElementById('ibadati-qibla-calibration');const action=root.querySelector('#qc-action');const fill=root.querySelector('#qc-fill');const level=root.querySelector('#qc-level');const badge=root.querySelector('#qc-status');const phone=root.querySelector('#qc-phone-icon');const message=root.querySelector('#qc-message');let stage=0;action.addEventListener('click',()=>{stage=Math.min(3,stage+1);const values=[28,52,78,96];const labels=['Low','Fair','Good','Excellent'];fill.style.width=`${values[stage]}%`;level.textContent=`${labels[stage]} · ${values[stage]}%`;phone.style.transform=`rotate(${stage%2?18:-12}deg)`;if(stage===3){badge.style.color='var(--qc-accent)';badge.innerHTML='<i data-lucide="circle-check" aria-hidden="true"></i><span>Ready for Qibla</span>';action.textContent='Open Qibla compass';message.textContent='Calibration complete.';if(globalThis.lucide)lucide.createIcons({attrs:{width:16,height:16}})}else message.textContent='Keep moving in a wide figure 8…'});const state={accent:'#0f766e',gold:'#b8893d',showInterferenceTip:true};const tip=root.querySelector('.qc-tip');function render(){root.style.setProperty('--qc-accent',state.accent);root.style.setProperty('--qc-gold',state.gold);tip.hidden=!state.showInterferenceTip}render();if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:render});tweak.addColorPicker(state,'accent',{label:'Accent color',reference:'--qc-accent'});tweak.addColorPicker(state,'gold',{label:'Motion path',reference:'--qc-gold'});tweak.addToggle(state,'showInterferenceTip',{label:'Show interference tip',reference:'qibla.tip'})}})();</script>
</div>
