<style>
#ramadan-screen{--m-bg:light-dark(#f4f1e8,#0d2724);--m-surface:light-dark(#fffdf7,#14332f);--m-text:light-dark(#18332f,#f7f1df);--m-muted:light-dark(#687873,#b6c6bf);--m-accent:light-dark(#176b5b,#77c7ad);--m-accent-text:light-dark(#fff,#09231f);--m-gold:light-dark(#b58b3b,#d8b768);--m-line:light-dark(rgba(23,107,91,.14),rgba(119,199,173,.18));font-family:Inter,system-ui,sans-serif;color:var(--m-text);display:grid;place-items:center;padding:12px}
#ramadan-screen *{box-sizing:border-box}#ramadan-screen .device{width:min(100%,390px);background:var(--m-bg);border:1px solid var(--m-line);border-radius:34px;overflow:hidden;box-shadow:0 22px 70px rgba(0,0,0,.16)}#ramadan-screen .status{display:flex;justify-content:space-between;padding:18px 22px 7px;font-size:12px;font-weight:500}#ramadan-screen .sys{display:flex;gap:8px}#ramadan-screen .sys i{width:14px;height:14px}#ramadan-screen .content{padding:12px 18px 20px}
#ramadan-screen .head{display:grid;grid-template-columns:44px 1fr 44px;align-items:center}#ramadan-screen .head h1{text-align:center;font-size:21px;font-weight:500;margin:0}#ramadan-screen .iconbtn{width:44px;height:44px;border:0;background:transparent;color:var(--m-text);display:grid;place-items:center;cursor:pointer}#ramadan-screen .iconbtn i{width:20px;height:20px}
#ramadan-screen .hero{margin:14px 0;background:var(--m-accent);color:var(--m-accent-text);border-radius:23px;padding:17px;position:relative;overflow:hidden}#ramadan-screen .hero:after{content:"";position:absolute;width:145px;height:145px;border-radius:50%;right:-48px;top:-55px;border:1px solid color-mix(in srgb,var(--m-accent-text) 17%,transparent);box-shadow:0 0 0 26px color-mix(in srgb,var(--m-accent-text) 4%,transparent)}#ramadan-screen .hero small{font-size:10px;opacity:.76}#ramadan-screen .hero h2{font-size:21px;font-weight:500;margin:5px 0 13px}#ramadan-screen .times{display:grid;grid-template-columns:1fr 1px 1fr;align-items:center;gap:13px;position:relative;z-index:1}#ramadan-screen .divider{height:35px;background:color-mix(in srgb,var(--m-accent-text) 18%,transparent)}#ramadan-screen .time span{display:block;font-size:10px;opacity:.73}#ramadan-screen .time strong{display:block;font-size:15px;font-weight:500;margin-top:4px}#ramadan-screen .time.end{text-align:right}
#ramadan-screen .today{background:var(--m-surface);border-radius:19px;padding:14px 15px;margin-bottom:18px;display:flex;align-items:center;justify-content:space-between}#ramadan-screen .today strong{display:block;font-size:13px;font-weight:500}#ramadan-screen .today small{display:block;font-size:10px;color:var(--m-muted);margin-top:4px}#ramadan-screen .fast-toggle{min-height:40px;border:0;border-radius:13px;background:color-mix(in srgb,var(--m-accent) 11%,var(--m-surface));color:var(--m-accent);font:inherit;font-size:11px;padding:0 13px;cursor:pointer}#ramadan-screen .fast-toggle.done{background:var(--m-accent);color:var(--m-accent-text)}
#ramadan-screen .section{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}#ramadan-screen .section h2{font-size:14px;font-weight:500;margin:0}#ramadan-screen .section span{font-size:11px;color:var(--m-muted)}#ramadan-screen .week{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:18px}#ramadan-screen .day{border:0;background:transparent;color:var(--m-muted);font:inherit;font-size:10px;text-align:center;padding:2px;cursor:pointer}#ramadan-screen .day span{width:35px;height:35px;border-radius:12px;background:var(--m-surface);color:var(--m-text);display:grid;place-items:center;margin:5px auto 0;font-size:11px}#ramadan-screen .day.done span{background:color-mix(in srgb,var(--m-accent) 12%,var(--m-surface));color:var(--m-accent)}#ramadan-screen .day.today-day span{background:var(--m-accent);color:var(--m-accent-text)}
#ramadan-screen .progress-wrap{margin-bottom:19px}#ramadan-screen .progress-label{display:flex;justify-content:space-between;font-size:11px;color:var(--m-muted);margin-bottom:8px}#ramadan-screen .progress{height:6px;background:var(--m-line);border-radius:99px;overflow:hidden}#ramadan-screen .bar{height:100%;width:37%;background:var(--m-accent);border-radius:99px}
#ramadan-screen .tools{display:grid;grid-template-columns:1fr 1fr;gap:9px}#ramadan-screen .tool{min-height:79px;border:0;border-radius:18px;background:var(--m-surface);color:var(--m-text);font:inherit;padding:12px;text-align:left;cursor:pointer}#ramadan-screen .tool i{width:19px;height:19px;color:var(--m-gold);margin-bottom:9px}#ramadan-screen .tool strong{display:block;font-size:12px;font-weight:500}#ramadan-screen .tool small{display:block;color:var(--m-muted);font-size:10px;margin-top:3px}#ramadan-screen .toast{height:20px;text-align:center;color:var(--m-muted);font-size:11px;padding-top:6px}
@media(max-width:420px){#ramadan-screen{padding:0}#ramadan-screen .device{border-radius:26px}#ramadan-screen .content{padding-left:15px;padding-right:15px}.week{gap:3px}.day span{width:32px}}
</style>
<div id="ramadan-screen" aria-label="Ibadati Ramadan and fasting dashboard preview"><section class="device"><div class="status"><span>9:41</span><span class="sys"><i data-lucide="signal" aria-hidden="true"></i><i data-lucide="wifi" aria-hidden="true"></i><i data-lucide="battery-full" aria-hidden="true"></i></span></div><main class="content">
 <header class="head"><button class="iconbtn" type="button" aria-label="Back"><i data-lucide="arrow-left" aria-hidden="true"></i></button><h1>Ramadan</h1><button class="iconbtn" type="button" aria-label="Ramadan settings"><i data-lucide="settings-2" aria-hidden="true"></i></button></header>
 <section class="hero"><small>12 Ramadan · New Delhi</small><h2>11h 39m fasting today</h2><div class="times"><div class="time"><span>Suhoor ends</span><strong>5:02 AM</strong></div><span class="divider"></span><div class="time end"><span>Iftar begins</span><strong>6:41 PM</strong></div></div></section>
 <section class="today"><div><strong>Are you fasting today?</strong><small>Your answer stays private on this device</small></div><button class="fast-toggle" type="button" aria-pressed="false">Mark fast</button></section>
 <div class="section"><h2>Your fasting week</h2><span class="fasts">3 of 7</span></div><div class="week"><button class="day done" type="button">M<span>8</span></button><button class="day done" type="button">T<span>9</span></button><button class="day done" type="button">W<span>10</span></button><button class="day today-day" type="button">T<span>11</span></button><button class="day" type="button">F<span>12</span></button><button class="day" type="button">S<span>13</span></button><button class="day" type="button">S<span>14</span></button></div>
 <div class="progress-wrap"><div class="progress-label"><span>Ramadan progress</span><span>11 of 30 days</span></div><div class="progress"><div class="bar"></div></div></div>
 <div class="section"><h2>For your fast</h2></div><div class="tools"><button class="tool" type="button" data-name="Fasting duas"><i data-lucide="hand-heart" aria-hidden="true"></i><strong>Fasting duas</strong><small>Suhoor and Iftar</small></button><button class="tool" type="button" data-name="Monthly calendar"><i data-lucide="calendar-days" aria-hidden="true"></i><strong>Full calendar</strong><small>30-day timetable</small></button><button class="tool" type="button" data-name="Make-up fasts"><i data-lucide="list-checks" aria-hidden="true"></i><strong>Make-up fasts</strong><small>Track missed days</small></button><button class="tool" type="button" data-name="Fasting settings"><i data-lucide="clock-3" aria-hidden="true"></i><strong>Time settings</strong><small>Local adjustments</small></button></div><div class="toast" aria-live="polite"></div>
 </main></section></div>
<script>
(()=>{const root=document.getElementById('ramadan-screen');const state={accent:'#176b5b',showPrivacy:true,heroRadius:23};const toggle=root.querySelector('.fast-toggle'),toast=root.querySelector('.toast');toggle.addEventListener('click',()=>{const done=toggle.getAttribute('aria-pressed')!=='true';toggle.setAttribute('aria-pressed',String(done));toggle.classList.toggle('done',done);toggle.textContent=done?'Fast marked ✓':'Mark fast';root.querySelector('.fasts').textContent=done?'4 of 7':'3 of 7';toast.textContent=done?'Today’s fast saved privately':'Today’s fast unmarked'});root.querySelectorAll('.tool').forEach(item=>item.addEventListener('click',()=>toast.textContent=`Opening ${item.dataset.name}`));function render(){root.style.setProperty('--m-accent',state.accent);root.querySelector('.today small').style.display=state.showPrivacy?'block':'none';root.querySelector('.hero').style.borderRadius=`${state.heroRadius}px`}render();if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:render});tweak.addColorPicker(state,'accent',{label:'Brand accent',reference:'--m-accent'});tweak.addToggle(state,'showPrivacy',{label:'Privacy note',reference:'privacy.visible'});tweak.addSlider(state,'heroRadius',{label:'Header radius',min:12,max:30,unit:'px',reference:'hero.radius'})}})();
</script>
