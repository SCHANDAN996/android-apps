<div id="ibadati-adhan-alert" aria-label="Ibadati prayer time adhan alert">
  <style>
    #ibadati-adhan-alert{--aa-accent:#0f766e;--aa-deep:light-dark(#0d5f59,#102f2b);--aa-text:#f7fffc;--aa-muted:#c5dcd6;--aa-glow:#d8b468;--aa-panel:#ffffff16;color-scheme:light dark;color:var(--aa-text);font-family:Inter,ui-sans-serif,system-ui,sans-serif;max-width:430px;margin:0 auto}#ibadati-adhan-alert *{box-sizing:border-box}
    #ibadati-adhan-alert .aa-phone{min-height:700px;border-radius:28px;overflow:hidden;background:linear-gradient(165deg,var(--aa-deep),light-dark(#073b38,#091714));box-shadow:0 16px 44px light-dark(#143d3540,#00000066);position:relative;padding:22px 20px 20px;display:flex;flex-direction:column}#ibadati-adhan-alert .aa-phone:before,#ibadati-adhan-alert .aa-phone:after{content:"";position:absolute;border-radius:50%;pointer-events:none}#ibadati-adhan-alert .aa-phone:before{width:260px;height:260px;right:-100px;top:-100px;background:#ffffff0c}#ibadati-adhan-alert .aa-phone:after{width:220px;height:220px;left:-130px;bottom:70px;background:color-mix(in srgb,var(--aa-glow) 10%,transparent)}
    #ibadati-adhan-alert .aa-top{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--aa-muted);position:relative;z-index:1}#ibadati-adhan-alert .aa-brand{display:flex;align-items:center;gap:7px;color:var(--aa-text);font-weight:500}#ibadati-adhan-alert .aa-brand i{color:var(--aa-glow)}#ibadati-adhan-alert .aa-dismiss{width:44px;height:44px;border:0;border-radius:50%;background:var(--aa-panel);color:var(--aa-text);display:grid;place-items:center}
    #ibadati-adhan-alert .aa-center{text-align:center;padding:58px 0 32px;position:relative;z-index:1}#ibadati-adhan-alert .aa-moon{width:92px;height:92px;border-radius:50%;display:grid;place-items:center;margin:0 auto 28px;background:#ffffff10;color:var(--aa-glow);box-shadow:0 0 44px color-mix(in srgb,var(--aa-glow) 24%,transparent)}#ibadati-adhan-alert .aa-moon i{width:40px;height:40px}#ibadati-adhan-alert h1,#ibadati-adhan-alert p{margin:0}#ibadati-adhan-alert .aa-kicker{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--aa-muted)}#ibadati-adhan-alert h1{font-size:38px;font-weight:500;margin-top:10px}#ibadati-adhan-alert .aa-time{font-size:21px;margin-top:9px}#ibadati-adhan-alert .aa-location{font-size:13px;color:var(--aa-muted);margin-top:8px}#ibadati-adhan-alert .aa-quote{font-family:"Noto Naskh Arabic",serif;font-size:25px;direction:rtl;margin-top:34px}#ibadati-adhan-alert .aa-meaning{font-size:12px;color:var(--aa-muted);margin-top:7px}
    #ibadati-adhan-alert .aa-player{position:relative;z-index:1;margin-top:auto;background:var(--aa-panel);border-radius:22px;padding:16px}#ibadati-adhan-alert .aa-playing{display:flex;justify-content:space-between;align-items:center;font-size:13px}#ibadati-adhan-alert .aa-wave{height:30px;display:flex;align-items:center;gap:4px;margin:12px 0}#ibadati-adhan-alert .aa-wave span{display:block;width:4px;border-radius:99px;background:var(--aa-glow);height:var(--h);animation:aa-wave 1.1s ease-in-out infinite alternate;animation-delay:var(--d)}#ibadati-adhan-alert .aa-track{height:4px;border-radius:99px;background:#ffffff22;overflow:hidden}#ibadati-adhan-alert .aa-fill{height:100%;width:34%;background:var(--aa-glow);transition:width .3s linear}#ibadati-adhan-alert .aa-controls{display:grid;grid-template-columns:1fr 64px 1fr;align-items:center;gap:10px;margin-top:15px}#ibadati-adhan-alert .aa-control{min-height:48px;border:0;background:transparent;color:var(--aa-text);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11px}#ibadati-adhan-alert .aa-main{width:64px;height:64px;border:0;border-radius:50%;background:var(--aa-text);color:var(--aa-deep);display:grid;place-items:center}#ibadati-adhan-alert .aa-shortcuts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px;position:relative;z-index:1}#ibadati-adhan-alert .aa-shortcuts button{min-height:48px;border:0;border-radius:15px;background:var(--aa-panel);color:var(--aa-text);display:flex;align-items:center;justify-content:center;gap:8px;font-size:13px}#ibadati-adhan-alert .aa-status{text-align:center;min-height:18px;color:var(--aa-muted);font-size:12px;margin-top:8px}
    @keyframes aa-wave{from{transform:scaleY(.55)}to{transform:scaleY(1)}}@media(prefers-reduced-motion:reduce){#ibadati-adhan-alert .aa-wave span{animation:none}}@media(max-width:350px){#ibadati-adhan-alert .aa-phone{padding-left:15px;padding-right:15px;min-height:660px}#ibadati-adhan-alert .aa-center{padding-top:42px}}
  </style>
  <section class="aa-phone"><div class="aa-top"><div class="aa-brand"><i data-lucide="moon-star" aria-hidden="true"></i>Ibadati</div><button class="aa-dismiss" type="button" aria-label="Dismiss alert"><i data-lucide="x" aria-hidden="true"></i></button></div>
    <main class="aa-center"><div class="aa-moon"><i data-lucide="sunset" aria-hidden="true"></i></div><p class="aa-kicker">It’s time for</p><h1>Maghrib</h1><p class="aa-time">6:41 PM</p><p class="aa-location">New Delhi · 12 Ramadan 1448</p><p class="aa-quote" lang="ar">حَيَّ عَلَى الصَّلَاةِ</p><p class="aa-meaning">Come to prayer</p></main>
    <section class="aa-player"><div class="aa-playing"><span id="aa-playing-label">Adhan is playing</span><span id="aa-duration">1:12 / 3:28</span></div><div class="aa-wave" aria-hidden="true"><span style="--h:12px;--d:-.1s"></span><span style="--h:23px;--d:-.7s"></span><span style="--h:16px;--d:-.3s"></span><span style="--h:28px;--d:-.9s"></span><span style="--h:19px;--d:-.2s"></span><span style="--h:25px;--d:-.6s"></span><span style="--h:13px;--d:-.4s"></span><span style="--h:29px;--d:-.8s"></span><span style="--h:17px;--d:-.5s"></span><span style="--h:22px;--d:-.1s"></span><span style="--h:14px;--d:-.7s"></span><span style="--h:26px;--d:-.3s"></span></div><div class="aa-track"><div class="aa-fill"></div></div><div class="aa-controls"><button class="aa-control" id="aa-silent" type="button"><i data-lucide="volume-x" aria-hidden="true"></i>Silent</button><button class="aa-main" id="aa-play" type="button" aria-label="Pause adhan" aria-pressed="true"><i data-lucide="pause" aria-hidden="true"></i></button><button class="aa-control" id="aa-stop" type="button"><i data-lucide="square" aria-hidden="true"></i>Stop</button></div></section>
    <div class="aa-shortcuts"><button type="button"><i data-lucide="compass" aria-hidden="true"></i>Open Qibla</button><button type="button"><i data-lucide="map-pin" aria-hidden="true"></i>Nearby mosque</button></div><p class="aa-status" id="aa-status" aria-live="polite"></p>
  </section>
  <script>
    (()=>{const root=document.getElementById('ibadati-adhan-alert');const play=root.querySelector('#aa-play');const label=root.querySelector('#aa-playing-label');const wave=root.querySelector('.aa-wave');const status=root.querySelector('#aa-status');let playing=true;const update=()=>{play.setAttribute('aria-pressed',String(playing));play.setAttribute('aria-label',playing?'Pause adhan':'Resume adhan');play.innerHTML=playing?'<i data-lucide="pause" aria-hidden="true"></i>':'<i data-lucide="play" aria-hidden="true"></i>';label.textContent=playing?'Adhan is playing':'Adhan paused';wave.style.opacity=playing?'1':'.35';if(globalThis.lucide)lucide.createIcons({attrs:{width:16,height:16}})};play.addEventListener('click',()=>{playing=!playing;update()});root.querySelector('#aa-silent').addEventListener('click',()=>{playing=false;update();status.textContent='Future alerts will use vibration only.'});root.querySelector('#aa-stop').addEventListener('click',()=>{playing=false;update();status.textContent='Adhan stopped.'});const state={accent:'#0f766e',glow:'#d8b468',showShortcuts:true};const shortcuts=root.querySelector('.aa-shortcuts');function render(){root.style.setProperty('--aa-accent',state.accent);root.style.setProperty('--aa-deep',state.accent);root.style.setProperty('--aa-glow',state.glow);shortcuts.hidden=!state.showShortcuts}render();if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:render});tweak.addColorPicker(state,'accent',{label:'Background accent',reference:'--aa-deep'});tweak.addColorPicker(state,'glow',{label:'Highlight color',reference:'--aa-glow'});tweak.addToggle(state,'showShortcuts',{label:'Show shortcuts',reference:'adhan.shortcuts'})}})();
  </script>
</div>
