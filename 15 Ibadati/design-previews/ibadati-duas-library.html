<style>
#duas-lib{--d-bg:light-dark(#f4f1e8,#0d2724);--d-surface:light-dark(#fffdf7,#14332f);--d-text:light-dark(#18332f,#f7f1df);--d-muted:light-dark(#687873,#b6c6bf);--d-accent:light-dark(#176b5b,#77c7ad);--d-accent-text:light-dark(#fff,#09231f);--d-gold:light-dark(#b58b3b,#d8b768);--d-line:light-dark(rgba(23,107,91,.14),rgba(119,199,173,.18));font-family:Inter,system-ui,sans-serif;color:var(--d-text);display:grid;place-items:center;padding:12px}
#duas-lib *{box-sizing:border-box}#duas-lib .device{width:min(100%,390px);background:var(--d-bg);border:1px solid var(--d-line);border-radius:34px;overflow:hidden;box-shadow:0 22px 70px rgba(0,0,0,.16)}#duas-lib .status{display:flex;justify-content:space-between;padding:18px 22px 7px;font-size:12px;font-weight:500}#duas-lib .sys{display:flex;gap:8px}#duas-lib .sys i{width:14px;height:14px}#duas-lib .content{padding:12px 18px 18px}
#duas-lib .head{display:grid;grid-template-columns:44px 1fr 44px;align-items:center}#duas-lib .head h1{text-align:center;font-size:21px;font-weight:500;margin:0}#duas-lib .iconbtn{width:44px;height:44px;border:0;background:transparent;color:var(--d-text);display:grid;place-items:center;cursor:pointer}#duas-lib .iconbtn i{width:20px;height:20px}
#duas-lib .search{height:49px;border-radius:16px;background:var(--d-surface);display:flex;align-items:center;gap:10px;padding:0 14px;margin:14px 0 15px;color:var(--d-muted)}#duas-lib .search i{width:18px;height:18px}#duas-lib .search input{width:100%;border:0;outline:0;background:transparent;color:var(--d-text);font:inherit;font-size:14px}#duas-lib .search input::placeholder{color:var(--d-muted)}
#duas-lib .tabs{display:flex;gap:7px;overflow:hidden;margin-bottom:19px}#duas-lib .tab{min-height:38px;border:0;border-radius:13px;background:var(--d-surface);color:var(--d-muted);padding:0 13px;font:inherit;font-size:11px;white-space:nowrap;cursor:pointer}#duas-lib .tab.active{background:var(--d-accent);color:var(--d-accent-text)}
#duas-lib .continue{background:var(--d-accent);color:var(--d-accent-text);border-radius:21px;padding:16px;margin-bottom:20px;display:flex;justify-content:space-between;align-items:center}#duas-lib .continue small{font-size:10px;opacity:.76}#duas-lib .continue strong{display:block;font-size:15px;font-weight:500;margin:5px 0 3px}#duas-lib .continue span{font-size:10px;opacity:.76}#duas-lib .play{width:44px;height:44px;border:0;border-radius:15px;background:color-mix(in srgb,var(--d-accent-text) 14%,transparent);color:var(--d-accent-text);display:grid;place-items:center;cursor:pointer}#duas-lib .play i{width:18px;height:18px}
#duas-lib .section{display:flex;justify-content:space-between;align-items:center;margin:0 0 11px}#duas-lib .section h2{font-size:14px;font-weight:500;margin:0}#duas-lib .section button{border:0;background:transparent;color:var(--d-accent);font:inherit;font-size:11px;cursor:pointer}
#duas-lib .categories{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:20px}#duas-lib .category{min-height:84px;border:0;border-radius:18px;background:var(--d-surface);color:var(--d-text);padding:12px;text-align:left;font:inherit;cursor:pointer;display:flex;align-items:center;gap:11px}#duas-lib .cat-icon{width:39px;height:39px;border-radius:14px;background:color-mix(in srgb,var(--d-accent) 11%,var(--d-surface));color:var(--d-accent);display:grid;place-items:center;flex:0 0 auto}#duas-lib .cat-icon i{width:18px;height:18px}#duas-lib .category strong{display:block;font-size:12px;font-weight:500}#duas-lib .category small{display:block;color:var(--d-muted);font-size:10px;margin-top:3px}
#duas-lib .list{display:grid;gap:8px}#duas-lib .dua{min-height:66px;border:0;border-radius:17px;background:var(--d-surface);color:var(--d-text);padding:10px 12px;display:grid;grid-template-columns:38px 1fr 44px;gap:9px;align-items:center;text-align:left;font:inherit;cursor:pointer}#duas-lib .number{width:32px;height:32px;border-radius:11px;background:color-mix(in srgb,var(--d-gold) 12%,var(--d-surface));color:var(--d-gold);display:grid;place-items:center;font-size:11px}#duas-lib .dua strong{display:block;font-size:12px;font-weight:500}#duas-lib .dua small{display:block;color:var(--d-muted);font-size:10px;margin-top:4px}#duas-lib .save{width:44px;height:44px;border:0;background:transparent;color:var(--d-muted);display:grid;place-items:center;cursor:pointer}#duas-lib .save i{width:17px;height:17px}#duas-lib .save.saved{color:var(--d-gold)}#duas-lib .toast{height:19px;text-align:center;color:var(--d-muted);font-size:11px;padding-top:5px}
@media(max-width:420px){#duas-lib{padding:0}#duas-lib .device{border-radius:26px}#duas-lib .content{padding-left:15px;padding-right:15px}.categories{gap:7px}}
</style>
<div id="duas-lib" aria-label="Ibadati Duas and Azkar library preview">
 <section class="device"><div class="status"><span>9:41</span><span class="sys"><i data-lucide="signal" aria-hidden="true"></i><i data-lucide="wifi" aria-hidden="true"></i><i data-lucide="battery-full" aria-hidden="true"></i></span></div>
  <main class="content">
   <header class="head"><button class="iconbtn" type="button" aria-label="Back"><i data-lucide="arrow-left" aria-hidden="true"></i></button><h1>Duas & Azkar</h1><button class="iconbtn" type="button" aria-label="Saved duas"><i data-lucide="bookmark" aria-hidden="true"></i></button></header>
   <label class="search"><i data-lucide="search" aria-hidden="true"></i><input type="search" placeholder="Search by moment or need" aria-label="Search duas"></label>
   <div class="tabs" role="tablist" aria-label="Dua type"><button class="tab active" type="button">All</button><button class="tab" type="button">Daily</button><button class="tab" type="button">Morning</button><button class="tab" type="button">Evening</button></div>
   <section class="continue"><div><small>Continue reading</small><strong>Morning remembrance</strong><span>4 of 12 completed</span></div><button class="play" type="button" aria-label="Continue morning remembrance"><i data-lucide="play" aria-hidden="true"></i></button></section>
   <div class="section"><h2>Browse by moment</h2><button type="button">View all</button></div>
   <div class="categories"><button class="category" type="button"><span class="cat-icon"><i data-lucide="sunrise" aria-hidden="true"></i></span><span><strong>Morning</strong><small>12 azkar</small></span></button><button class="category" type="button"><span class="cat-icon"><i data-lucide="moon-star" aria-hidden="true"></i></span><span><strong>Evening</strong><small>11 azkar</small></span></button><button class="category" type="button"><span class="cat-icon"><i data-lucide="bed-double" aria-hidden="true"></i></span><span><strong>Sleep</strong><small>8 duas</small></span></button><button class="category" type="button"><span class="cat-icon"><i data-lucide="shield" aria-hidden="true"></i></span><span><strong>Protection</strong><small>14 duas</small></span></button></div>
   <div class="section"><h2>Popular duas</h2><button type="button">See all</button></div>
   <div class="list"><div class="dua" data-title="Before eating"><span class="number">01</span><span><strong>Before eating</strong><small>Daily life · Short</small></span><button class="save" type="button" aria-label="Save dua"><i data-lucide="bookmark" aria-hidden="true"></i></button></div><div class="dua" data-title="Leaving home"><span class="number">02</span><span><strong>Leaving home</strong><small>Travel · Protection</small></span><button class="save" type="button" aria-label="Save dua"><i data-lucide="bookmark" aria-hidden="true"></i></button></div><div class="dua" data-title="For forgiveness"><span class="number">03</span><span><strong>For forgiveness</strong><small>Repentance · Medium</small></span><button class="save" type="button" aria-label="Save dua"><i data-lucide="bookmark" aria-hidden="true"></i></button></div></div>
   <div class="toast" aria-live="polite"></div>
  </main>
 </section>
</div>
<script>
(()=>{const root=document.getElementById('duas-lib');const state={accent:'#176b5b',continueCard:true,cardRadius:18};const toast=root.querySelector('.toast');root.querySelectorAll('.tab').forEach(tab=>tab.addEventListener('click',()=>{root.querySelectorAll('.tab').forEach(item=>item.classList.toggle('active',item===tab));toast.textContent=`Showing ${tab.textContent} duas`}));root.querySelectorAll('.save').forEach(button=>button.addEventListener('click',event=>{event.stopPropagation();const saved=button.classList.toggle('saved');button.innerHTML=`<i data-lucide="${saved?'bookmark-check':'bookmark'}" aria-hidden="true"></i>`;toast.textContent=saved?'Saved':'Removed from saved';if(globalThis.lucide)lucide.createIcons({attrs:{width:16,height:16}})}));root.querySelector('input').addEventListener('input',event=>{const term=event.target.value.toLowerCase();root.querySelectorAll('.dua').forEach(item=>item.style.display=item.dataset.title.toLowerCase().includes(term)?'grid':'none')});function render(){root.style.setProperty('--d-accent',state.accent);root.querySelector('.continue').style.display=state.continueCard?'flex':'none';root.querySelectorAll('.category').forEach(item=>item.style.borderRadius=`${state.cardRadius}px`)}render();if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:render});tweak.addColorPicker(state,'accent',{label:'Brand accent',reference:'--d-accent'});tweak.addToggle(state,'continueCard',{label:'Continue card',reference:'continue.visible'});tweak.addSlider(state,'cardRadius',{label:'Category radius',min:10,max:26,unit:'px',reference:'category.radius'})}})();
</script>
