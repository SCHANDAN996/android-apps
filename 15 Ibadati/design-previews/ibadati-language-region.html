<div id="ibadati-language-region" aria-label="Ibadati language and region settings">
  <style>
    #ibadati-language-region {
      --ib-accent: #0f766e;
      --ib-gold: #b8893d;
      --ib-bg: light-dark(#f5f1e8, #101917);
      --ib-surface: light-dark(#fffdf8, #182421);
      --ib-soft: light-dark(#e5f1ed, #203630);
      --ib-text: light-dark(#18312d, #eef8f5);
      --ib-muted: light-dark(#687773, #aebfba);
      --ib-line: light-dark(#dde4df, #31423d);
      color-scheme: light dark;
      color: var(--ib-text);
      font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      max-width: 430px;
      margin: 0 auto;
    }
    #ibadati-language-region .ib-phone { background: var(--ib-bg); border-radius: 28px; overflow: hidden; box-shadow: 0 16px 44px light-dark(#143d3524, #00000055); }
    #ibadati-language-region .ib-top { padding: 20px 18px 14px; background: var(--ib-surface); }
    #ibadati-language-region .ib-head { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
    #ibadati-language-region .ib-back { width: 44px; height: 44px; border: 0; border-radius: 50%; background: var(--ib-soft); color: var(--ib-text); display: grid; place-items: center; }
    #ibadati-language-region h2, #ibadati-language-region h3, #ibadati-language-region p { margin: 0; }
    #ibadati-language-region h2 { font-size: 20px; font-weight: 500; }
    #ibadati-language-region .ib-sub { margin-top: 3px; color: var(--ib-muted); font-size: 13px; }
    #ibadati-language-region .ib-search { position: relative; }
    #ibadati-language-region .ib-search i { position: absolute; left: 14px; top: 14px; color: var(--ib-muted); }
    #ibadati-language-region .ib-search input { width: 100%; min-height: 46px; box-sizing: border-box; border: 1px solid var(--ib-line); border-radius: 14px; padding: 0 14px 0 42px; background: var(--ib-bg); color: var(--ib-text); font-size: 16px; }
    #ibadati-language-region .ib-content { padding: 18px; }
    #ibadati-language-region .ib-label { color: var(--ib-muted); font-size: 12px; letter-spacing: .06em; text-transform: uppercase; margin: 0 0 8px 4px; }
    #ibadati-language-region .ib-list { background: var(--ib-surface); border-radius: 18px; overflow: hidden; margin-bottom: 20px; }
    #ibadati-language-region .ib-lang { width: 100%; min-height: 58px; padding: 8px 14px; border: 0; border-bottom: 1px solid var(--ib-line); background: transparent; color: var(--ib-text); display: flex; align-items: center; gap: 12px; text-align: left; }
    #ibadati-language-region .ib-lang:last-child { border-bottom: 0; }
    #ibadati-language-region .ib-code { width: 34px; height: 34px; border-radius: 10px; background: var(--ib-soft); display: grid; place-items: center; color: var(--ib-accent); font-size: 12px; font-weight: 500; flex: 0 0 auto; }
    #ibadati-language-region .ib-lang-copy { flex: 1; min-width: 0; }
    #ibadati-language-region .ib-native { display: block; font-weight: 500; }
    #ibadati-language-region .ib-english { display: block; margin-top: 2px; color: var(--ib-muted); font-size: 12px; }
    #ibadati-language-region .ib-check { color: var(--ib-accent); opacity: 0; }
    #ibadati-language-region .ib-lang[aria-pressed="true"] { background: var(--ib-soft); }
    #ibadati-language-region .ib-lang[aria-pressed="true"] .ib-check { opacity: 1; }
    #ibadati-language-region .ib-direction { display: flex; gap: 10px; align-items: center; padding: 12px 14px; margin: -8px 0 20px; color: var(--ib-muted); font-size: 13px; }
    #ibadati-language-region .ib-direction i { color: var(--ib-gold); }
    #ibadati-language-region .ib-region { background: var(--ib-surface); border-radius: 18px; overflow: hidden; }
    #ibadati-language-region .ib-setting { min-height: 60px; padding: 8px 14px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid var(--ib-line); }
    #ibadati-language-region .ib-setting:last-child { border-bottom: 0; }
    #ibadati-language-region .ib-setting > i { color: var(--ib-accent); }
    #ibadati-language-region .ib-setting label { flex: 1; }
    #ibadati-language-region select { min-height: 40px; max-width: 145px; border: 0; background: transparent; color: var(--ib-text); font: inherit; text-align: right; }
    #ibadati-language-region .ib-save { width: 100%; min-height: 50px; margin-top: 18px; border: 0; border-radius: 15px; background: var(--ib-accent); color: #ffffff; font-weight: 500; font-size: 16px; }
    #ibadati-language-region .ib-feedback { width: 100%; min-height: 48px; margin-top: 8px; border: 0; background: transparent; color: var(--ib-muted); display: flex; justify-content: center; align-items: center; gap: 8px; }
    #ibadati-language-region .ib-hidden { display: none; }
    @media (max-width: 360px) { #ibadati-language-region .ib-top, #ibadati-language-region .ib-content { padding-left: 14px; padding-right: 14px; } }
  </style>
  <section class="ib-phone">
    <header class="ib-top">
      <div class="ib-head">
        <button class="ib-back" type="button" aria-label="Go back"><i data-lucide="arrow-left" aria-hidden="true"></i></button>
        <div><h2>Language &amp; region</h2><p class="ib-sub">Make Ibadati feel local, wherever you are</p></div>
      </div>
      <div class="ib-search"><i data-lucide="search" aria-hidden="true"></i><input id="ib-language-search" type="search" placeholder="Search language" aria-label="Search language"></div>
    </header>
    <main class="ib-content">
      <p class="ib-label">App language</p>
      <div class="ib-list" id="ib-language-list">
        <button class="ib-lang" type="button" aria-pressed="true" data-name="english" data-direction="Left to right"><span class="ib-code">EN</span><span class="ib-lang-copy"><span class="ib-native">English</span><span class="ib-english">English</span></span><i class="ib-check" data-lucide="check" aria-hidden="true"></i></button>
        <button class="ib-lang" type="button" aria-pressed="false" data-name="arabic العربية" data-direction="Right to left"><span class="ib-code">AR</span><span class="ib-lang-copy"><span class="ib-native" dir="rtl">العربية</span><span class="ib-english">Arabic</span></span><i class="ib-check" data-lucide="check" aria-hidden="true"></i></button>
        <button class="ib-lang" type="button" aria-pressed="false" data-name="urdu اردو" data-direction="Right to left"><span class="ib-code">UR</span><span class="ib-lang-copy"><span class="ib-native" dir="rtl">اردو</span><span class="ib-english">Urdu</span></span><i class="ib-check" data-lucide="check" aria-hidden="true"></i></button>
        <button class="ib-lang" type="button" aria-pressed="false" data-name="hindi हिन्दी"><span class="ib-code">HI</span><span class="ib-lang-copy"><span class="ib-native">हिन्दी</span><span class="ib-english">Hindi</span></span><i class="ib-check" data-lucide="check" aria-hidden="true"></i></button>
        <button class="ib-lang" type="button" aria-pressed="false" data-name="bahasa indonesia"><span class="ib-code">ID</span><span class="ib-lang-copy"><span class="ib-native">Bahasa Indonesia</span><span class="ib-english">Indonesian</span></span><i class="ib-check" data-lucide="check" aria-hidden="true"></i></button>
        <button class="ib-lang" type="button" aria-pressed="false" data-name="turkish türkçe"><span class="ib-code">TR</span><span class="ib-lang-copy"><span class="ib-native">Türkçe</span><span class="ib-english">Turkish</span></span><i class="ib-check" data-lucide="check" aria-hidden="true"></i></button>
        <button class="ib-lang" type="button" aria-pressed="false" data-name="french français"><span class="ib-code">FR</span><span class="ib-lang-copy"><span class="ib-native">Français</span><span class="ib-english">French</span></span><i class="ib-check" data-lucide="check" aria-hidden="true"></i></button>
      </div>
      <div class="ib-direction" id="ib-direction-note" aria-live="polite"><i data-lucide="languages" aria-hidden="true"></i><span>Interface direction: <strong id="ib-direction">Left to right</strong></span></div>
      <p class="ib-label">Regional format</p>
      <div class="ib-region">
        <div class="ib-setting"><i data-lucide="clock-3" aria-hidden="true"></i><label for="ib-time">Time format</label><select id="ib-time"><option>Automatic</option><option>12-hour</option><option>24-hour</option></select></div>
        <div class="ib-setting"><i data-lucide="calendar-days" aria-hidden="true"></i><label for="ib-date">Date format</label><select id="ib-date"><option>Local format</option><option>DD/MM/YYYY</option><option>MM/DD/YYYY</option></select></div>
        <div class="ib-setting"><i data-lucide="binary" aria-hidden="true"></i><label for="ib-numerals">Numerals</label><select id="ib-numerals"><option>Local</option><option>123</option><option>١٢٣</option></select></div>
      </div>
      <button class="ib-save" id="ib-save-language" type="button">Save preferences</button>
      <button class="ib-feedback" type="button"><i data-lucide="message-circle" aria-hidden="true"></i>Help improve a translation</button>
    </main>
  </section>
  <script>
    (() => {
      const root = document.getElementById('ibadati-language-region');
      const rows = [...root.querySelectorAll('.ib-lang')];
      const search = root.querySelector('#ib-language-search');
      const direction = root.querySelector('#ib-direction');
      const note = root.querySelector('#ib-direction-note');
      rows.forEach((row) => row.addEventListener('click', () => {
        rows.forEach((item) => item.setAttribute('aria-pressed', String(item === row)));
        direction.textContent = row.dataset.direction || 'Left to right';
      }));
      search.addEventListener('input', () => {
        const query = search.value.trim().toLocaleLowerCase();
        rows.forEach((row) => row.classList.toggle('ib-hidden', !row.dataset.name.includes(query)));
      });
      const state = { accent: '#0f766e', directionNote: true, rowRadius: 18 };
      const render = () => {
        root.style.setProperty('--ib-accent', state.accent);
        note.hidden = !state.directionNote;
        root.querySelectorAll('.ib-list, .ib-region').forEach((el) => { el.style.borderRadius = `${state.rowRadius}px`; });
      };
      render();
      if (globalThis.Tweak) {
        const tweak = new Tweak({ container: root, onChange: render });
        tweak.addColorPicker(state, 'accent', { label: 'Accent color', reference: '--ib-accent' });
        tweak.addToggle(state, 'directionNote', { label: 'Direction note', reference: 'language.direction' });
        tweak.addSlider(state, 'rowRadius', { label: 'Row radius', min: 8, max: 28, unit: 'px', reference: 'language.radius' });
      }
    })();
  </script>
</div>
