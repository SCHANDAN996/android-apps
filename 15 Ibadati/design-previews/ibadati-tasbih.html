<style>
#tasbih-screen{--t-bg:light-dark(#f4f1e8,#0d2724);--t-surface:light-dark(#fffdf7,#14332f);--t-text:light-dark(#18332f,#f7f1df);--t-muted:light-dark(#687873,#b6c6bf);--t-accent:light-dark(#176b5b,#77c7ad);--t-accent-text:light-dark(#fff,#09231f);--t-gold:light-dark(#b58b3b,#d8b768);--t-line:light-dark(rgba(23,107,91,.14),rgba(119,199,173,.18));font-family:Inter,system-ui,sans-serif;color:var(--t-text);display:grid;place-items:center;padding:12px}
#tasbih-screen *{box-sizing:border-box}#tasbih-screen .device{width:min(100%,390px);background:var(--t-bg);border:1px solid var(--t-line);border-radius:34px;overflow:hidden;box-shadow:0 22px 70px rgba(0,0,0,.16)}#tasbih-screen .status{display:flex;justify-content:space-between;padding:18px 22px 7px;font-size:12px;font-weight:500}#tasbih-screen .sys{display:flex;gap:8px}#tasbih-screen .sys i{width:14px;height:14px}#tasbih-screen .content{min-height:650px;padding:12px 20px 22px;display:flex;flex-direction:column}
#tasbih-screen .head{display:grid;grid-template-columns:44px 1fr 44px;align-items:center}#tasbih-screen .head h1{text-align:center;font-size:21px;font-weight:500;margin:0}#tasbih-screen .iconbtn{width:44px;height:44px;border:0;background:transparent;color:var(--t-text);display:grid;place-items:center;cursor:pointer}#tasbih-screen .iconbtn i{width:20px;height:20px}
#tasbih-screen .dhikr{text-align:center;margin:25px 0 5px}#tasbih-screen .dhikr .arabic{font-family:"Noto Naskh Arabic","Amiri",serif;font-size:29px;direction:rtl}#tasbih-screen .dhikr strong{display:block;font-size:14px;font-weight:500;margin-top:7px}#tasbih-screen .dhikr small{display:block;color:var(--t-muted);font-size:11px;margin-top:4px}
#tasbih-screen .counter-wrap{flex:1;display:grid;place-items:center;padding:22px 0}#tasbih-screen .counter{width:246px;height:246px;border:0;border-radius:50%;background:var(--t-surface);color:var(--t-text);font:inherit;cursor:pointer;position:relative;box-shadow:inset 0 0 0 1px var(--t-line),0 25px 55px color-mix(in srgb,var(--t-accent) 12%,transparent)}#tasbih-screen .counter:before{content:"";position:absolute;inset:14px;border-radius:50%;border:7px solid color-mix(in srgb,var(--t-accent) 11%,transparent);border-top-color:var(--t-accent);transform:rotate(30deg)}#tasbih-screen .counter b{display:block;font-size:58px;line-height:1;font-weight:500;letter-spacing:-.04em;position:relative}#tasbih-screen .counter span{display:block;color:var(--t-muted);font-size:11px;margin-top:10px;position:relative}#tasbih-screen .counter.goal:after{content:"✓";position:absolute;right:20px;top:25px;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--t-accent);color:var(--t-accent-text)}
#tasbih-screen .goal-row{display:flex;justify-content:center;align-items:center;gap:8px;margin-bottom:18px;color:var(--t-muted);font-size:11px}#tasbih-screen .goal-row button{min-height:36px;border:0;border-radius:12px;background:var(--t-surface);color:var(--t-text);font:inherit;font-size:11px;padding:0 12px;cursor:pointer}#tasbih-screen .goal-row button.active{background:var(--t-accent);color:var(--t-accent-text)}
#tasbih-screen .controls{display:grid;grid-template-columns:1fr 1fr;gap:9px}#tasbih-screen .control{min-height:52px;border:0;border-radius:17px;background:var(--t-surface);color:var(--t-text);font:inherit;font-size:12px;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer}#tasbih-screen .control i{width:17px;height:17px;color:var(--t-accent)}#tasbih-screen .toast{height:20px;text-align:center;color:var(--t-muted);font-size:11px;padding-top:6px}
@media(max-width:420px){#tasbih-screen{padding:0}#tasbih-screen .device{border-radius:26px}#tasbih-screen .content{min-height:620px;padding-left:16px;padding-right:16px}#tasbih-screen .counter{width:228px;height:228px}}
@media(prefers-reduced-motion:no-preference){#tasbih-screen .counter:active{transform:scale(.98)}}
</style>
<div id="tasbih-screen" aria-label="Ibadati digital Tasbih preview">
 <section class="device"><div class="status"><span>9:41</span><span class="sys"><i data-lucide="signal" aria-hidden="true"></i><i data-lucide="wifi" aria-hidden="true"></i><i data-lucide="battery-full" aria-hidden="true"></i></span></div>
  <main class="content">
   <header class="head"><button class="iconbtn" type="button" aria-label="Back"><i data-lucide="arrow-left" aria-hidden="true"></i></button><h1>Tasbih</h1><button class="iconbtn" type="button" aria-label="Tasbih history"><i data-lucide="history" aria-hidden="true"></i></button></header>
   <section class="dhikr"><div class="arabic">سُبْحَانَ ٱللَّٰهِ</div><strong>SubhanAllah</strong><small>Glory be to Allah</small></section>
   <div class="counter-wrap"><button class="counter" type="button" aria-label="Tap to count"><b>0</b><span>Tap anywhere to count</span></button></div>
   <div class="goal-row"><span>Goal</span><button type="button" data-goal="33" class="active">33</button><button type="button" data-goal="99">99</button><button type="button" data-goal="100">100</button></div>
   <div class="controls"><button class="control reset" type="button"><i data-lucide="rotate-ccw" aria-hidden="true"></i>Reset session</button><button class="control haptic" type="button" aria-pressed="true"><i data-lucide="vibrate" aria-hidden="true"></i>Haptics on</button></div><div class="toast" aria-live="polite"></div>
  </main>
 </section>
</div>
<script>
(()=>{const root=document.getElementById('tasbih-screen');const state={accent:'#176b5b',counterSize:246,showMeaning:true};let count=0,goal=33,haptics=true;const button=root.querySelector('.counter'),value=button.querySelector('b'),toast=root.querySelector('.toast');button.addEventListener('click',()=>{count+=1;value.textContent=count;button.classList.toggle('goal',count>=goal);if(count===goal)toast.textContent='Goal complete · Alhamdulillah'});root.querySelector('.reset').addEventListener('click',()=>{count=0;value.textContent='0';button.classList.remove('goal');toast.textContent='Session reset'});root.querySelectorAll('[data-goal]').forEach(item=>item.addEventListener('click',()=>{goal=Number(item.dataset.goal);root.querySelectorAll('[data-goal]').forEach(x=>x.classList.toggle('active',x===item));button.classList.toggle('goal',count>=goal);toast.textContent=`Goal set to ${goal}`}));root.querySelector('.haptic').addEventListener('click',event=>{haptics=!haptics;event.currentTarget.setAttribute('aria-pressed',String(haptics));event.currentTarget.innerHTML=`<i data-lucide="${haptics?'vibrate':'vibrate-off'}" aria-hidden="true"></i>Haptics ${haptics?'on':'off'}`;if(globalThis.lucide)lucide.createIcons({attrs:{width:16,height:16}})});function render(){root.style.setProperty('--t-accent',state.accent);button.style.width=`${state.counterSize}px`;button.style.height=`${state.counterSize}px`;root.querySelector('.dhikr small').style.display=state.showMeaning?'block':'none'}render();if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:render});tweak.addColorPicker(state,'accent',{label:'Brand accent',reference:'--t-accent'});tweak.addSlider(state,'counterSize',{label:'Counter size',min:210,max:270,unit:'px',reference:'counter.size'});tweak.addToggle(state,'showMeaning',{label:'Dhikr meaning',reference:'meaning.visible'})}})();
</script>
