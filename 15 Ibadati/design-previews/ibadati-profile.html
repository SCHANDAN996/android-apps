<style>
#profile-screen{--p-bg:light-dark(#f4f1e8,#0d2724);--p-surface:light-dark(#fffdf7,#14332f);--p-text:light-dark(#18332f,#f7f1df);--p-muted:light-dark(#687873,#b6c6bf);--p-accent:light-dark(#176b5b,#77c7ad);--p-accent-text:light-dark(#fff,#09231f);--p-gold:light-dark(#b58b3b,#d8b768);--p-line:light-dark(rgba(23,107,91,.14),rgba(119,199,173,.18));font-family:Inter,system-ui,sans-serif;color:var(--p-text);display:grid;place-items:center;padding:12px}
#profile-screen *{box-sizing:border-box}#profile-screen .device{width:min(100%,390px);background:var(--p-bg);border:1px solid var(--p-line);border-radius:34px;overflow:hidden;box-shadow:0 22px 70px rgba(0,0,0,.16)}#profile-screen .status{display:flex;justify-content:space-between;padding:18px 22px 7px;font-size:12px;font-weight:500}#profile-screen .sys{display:flex;gap:8px}#profile-screen .sys i{width:14px;height:14px}#profile-screen .content{padding:14px 18px 12px}
#profile-screen .head{display:flex;justify-content:space-between;align-items:center}#profile-screen h1{font-size:25px;font-weight:500;margin:0}#profile-screen .iconbtn{width:44px;height:44px;border:0;background:transparent;color:var(--p-text);display:grid;place-items:center;cursor:pointer}#profile-screen .iconbtn i{width:20px;height:20px}
#profile-screen .profile{display:flex;align-items:center;gap:13px;background:var(--p-surface);border-radius:20px;padding:14px;margin:13px 0 18px}#profile-screen .avatar{width:48px;height:48px;border-radius:17px;background:var(--p-accent);color:var(--p-accent-text);display:grid;place-items:center;font-size:17px;font-weight:500}#profile-screen .profile strong{display:block;font-size:14px;font-weight:500}#profile-screen .profile small{display:block;color:var(--p-muted);font-size:10px;margin-top:4px}#profile-screen .profile button{margin-left:auto;width:44px;height:44px;border:0;background:transparent;color:var(--p-muted);display:grid;place-items:center;cursor:pointer}#profile-screen .profile button i{width:17px;height:17px}
#profile-screen .section{font-size:11px;color:var(--p-muted);margin:15px 3px 7px}#profile-screen .group{background:var(--p-surface);border-radius:19px;overflow:hidden}#profile-screen .item{width:100%;min-height:60px;border:0;border-bottom:1px solid var(--p-line);background:transparent;color:var(--p-text);font:inherit;padding:0 13px;display:grid;grid-template-columns:36px 1fr auto 20px;gap:9px;align-items:center;text-align:left;cursor:pointer}#profile-screen .item:last-child{border-bottom:0}#profile-screen .item>i:first-child{width:18px;height:18px;color:var(--p-accent)}#profile-screen .item strong{display:block;font-size:12px;font-weight:500}#profile-screen .item small{display:block;color:var(--p-muted);font-size:9px;margin-top:3px}#profile-screen .value{font-size:10px;color:var(--p-muted)}#profile-screen .chev{width:15px;height:15px;color:var(--p-muted)}
#profile-screen .switch{width:42px;height:24px;border:0;border-radius:99px;background:var(--p-line);padding:3px;cursor:pointer}#profile-screen .switch span{display:block;width:18px;height:18px;border-radius:50%;background:var(--p-surface);transition:transform .2s ease}#profile-screen .switch.on{background:var(--p-accent)}#profile-screen .switch.on span{transform:translateX(18px);background:var(--p-accent-text)}
#profile-screen .version{text-align:center;color:var(--p-muted);font-size:9px;margin:14px 0 1px}#profile-screen .toast{height:17px;text-align:center;color:var(--p-muted);font-size:10px}
#profile-screen .nav{background:var(--p-surface);padding:9px 10px 14px;display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--p-line)}#profile-screen .nav button{min-height:45px;border:0;background:transparent;color:var(--p-muted);font:inherit;font-size:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer}#profile-screen .nav i{width:19px;height:19px}#profile-screen .nav .active{color:var(--p-accent)}
@media(max-width:420px){#profile-screen{padding:0}#profile-screen .device{border-radius:26px}#profile-screen .content{padding-left:15px;padding-right:15px}}
</style>
<div id="profile-screen" aria-label="Ibadati profile and settings preview"><section class="device"><div class="status"><span>9:41</span><span class="sys"><i data-lucide="signal" aria-hidden="true"></i><i data-lucide="wifi" aria-hidden="true"></i><i data-lucide="battery-full" aria-hidden="true"></i></span></div><main class="content">
 <header class="head"><h1>Profile</h1><button class="iconbtn" type="button" aria-label="Help"><i data-lucide="circle-help" aria-hidden="true"></i></button></header>
 <section class="profile"><span class="avatar">CS</span><div><strong>Assalamu Alaikum</strong><small>Settings are saved privately</small></div><button type="button" aria-label="Edit profile"><i data-lucide="pencil" aria-hidden="true"></i></button></section>
 <div class="section">YOUR EXPERIENCE</div><div class="group"><button class="item language" type="button"><i data-lucide="languages" aria-hidden="true"></i><span><strong>Language</strong><small>App content and direction</small></span><span class="value">English</span><i class="chev" data-lucide="chevron-right" aria-hidden="true"></i></button><button class="item" type="button"><i data-lucide="palette" aria-hidden="true"></i><span><strong>Appearance</strong><small>Theme and text size</small></span><span class="value">System</span><i class="chev" data-lucide="chevron-right" aria-hidden="true"></i></button><button class="item" type="button"><i data-lucide="map-pin" aria-hidden="true"></i><span><strong>Location</strong><small>Prayer times and Qibla</small></span><span class="value">New Delhi</span><i class="chev" data-lucide="chevron-right" aria-hidden="true"></i></button></div>
 <div class="section">WORSHIP SETTINGS</div><div class="group"><button class="item" type="button"><i data-lucide="clock-3" aria-hidden="true"></i><span><strong>Prayer calculation</strong><small>Karachi · Hanafi</small></span><span></span><i class="chev" data-lucide="chevron-right" aria-hidden="true"></i></button><div class="item"><i data-lucide="bell-ring" aria-hidden="true"></i><span><strong>Adhan notifications</strong><small>4 of 5 prayers enabled</small></span><button class="switch on" type="button" aria-pressed="true" aria-label="Toggle Adhan notifications"><span></span></button><span></span></div><div class="item"><i data-lucide="download" aria-hidden="true"></i><span><strong>Offline content</strong><small>Duas available without internet</small></span><button class="switch on" type="button" aria-pressed="true" aria-label="Toggle offline content"><span></span></button><span></span></div></div>
 <div class="section">PRIVACY & SUPPORT</div><div class="group"><button class="item" type="button"><i data-lucide="shield-check" aria-hidden="true"></i><span><strong>Privacy & data</strong><small>Permissions and local storage</small></span><span></span><i class="chev" data-lucide="chevron-right" aria-hidden="true"></i></button><button class="item" type="button"><i data-lucide="message-circle-heart" aria-hidden="true"></i><span><strong>Help improve Ibadati</strong><small>Feedback and translation corrections</small></span><span></span><i class="chev" data-lucide="chevron-right" aria-hidden="true"></i></button></div>
 <div class="version">Ibadati · Version 1.0</div><div class="toast" aria-live="polite"></div>
 </main><nav class="nav" aria-label="Main navigation"><button type="button"><i data-lucide="house" aria-hidden="true"></i>Home</button><button type="button"><i data-lucide="clock-3" aria-hidden="true"></i>Prayer</button><button type="button"><i data-lucide="layout-grid" aria-hidden="true"></i>Explore</button><button type="button"><i data-lucide="compass" aria-hidden="true"></i>Qibla</button><button class="active" type="button"><i data-lucide="user-round" aria-hidden="true"></i>Profile</button></nav></section></div>
<script>
(()=>{const root=document.getElementById('profile-screen');const state={accent:'#176b5b',showProfile:true,groupRadius:19};const toast=root.querySelector('.toast');root.querySelectorAll('.switch').forEach(button=>button.addEventListener('click',()=>{const on=button.getAttribute('aria-pressed')!=='true';button.setAttribute('aria-pressed',String(on));button.classList.toggle('on',on);toast.textContent=on?'Setting enabled':'Setting disabled'}));const languages=['English','हिंदी','اردو'];let index=0;root.querySelector('.language').addEventListener('click',()=>{index=(index+1)%languages.length;root.querySelector('.language .value').textContent=languages[index];toast.textContent=`Language changed to ${languages[index]}`});function render(){root.style.setProperty('--p-accent',state.accent);root.querySelector('.profile').style.display=state.showProfile?'flex':'none';root.querySelectorAll('.group').forEach(group=>group.style.borderRadius=`${state.groupRadius}px`)}render();if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:render});tweak.addColorPicker(state,'accent',{label:'Brand accent',reference:'--p-accent'});tweak.addToggle(state,'showProfile',{label:'Profile summary',reference:'profile.visible'});tweak.addSlider(state,'groupRadius',{label:'Settings radius',min:10,max:26,unit:'px',reference:'settings.radius'})}})();
</script>
