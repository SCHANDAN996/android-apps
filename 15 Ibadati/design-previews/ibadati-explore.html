<style>
#ib-explore{--e-bg:light-dark(#f4f1e8,#0d2724);--e-surface:light-dark(#fffdf7,#14332f);--e-text:light-dark(#18332f,#f7f1df);--e-muted:light-dark(#687873,#b6c6bf);--e-accent:light-dark(#176b5b,#77c7ad);--e-accent-text:light-dark(#fff,#09231f);--e-gold:light-dark(#b58b3b,#d8b768);--e-line:light-dark(rgba(23,107,91,.14),rgba(119,199,173,.18));font-family:Inter,system-ui,sans-serif;color:var(--e-text);display:grid;place-items:center;padding:12px}
#ib-explore *{box-sizing:border-box}#ib-explore .device{width:min(100%,390px);background:var(--e-bg);border:1px solid var(--e-line);border-radius:34px;overflow:hidden;box-shadow:0 22px 70px rgba(0,0,0,.16)}#ib-explore .status{display:flex;justify-content:space-between;padding:18px 22px 7px;font-size:12px;font-weight:500}#ib-explore .sys{display:flex;gap:8px}#ib-explore .sys i{width:14px;height:14px}#ib-explore .content{padding:14px 18px 4px}
#ib-explore .head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}#ib-explore h1{font-size:25px;font-weight:500;margin:0}#ib-explore .head button{width:44px;height:44px;border:0;background:transparent;color:var(--e-text);display:grid;place-items:center;cursor:pointer}#ib-explore .head i{width:20px;height:20px}
#ib-explore .search{height:49px;border-radius:16px;background:var(--e-surface);display:flex;align-items:center;gap:10px;padding:0 14px;margin-bottom:18px;color:var(--e-muted)}#ib-explore .search i{width:18px;height:18px}#ib-explore .search input{width:100%;border:0;outline:0;background:transparent;color:var(--e-text);font:inherit;font-size:14px}#ib-explore .search input::placeholder{color:var(--e-muted)}
#ib-explore .featured{position:relative;overflow:hidden;background:var(--e-accent);color:var(--e-accent-text);border-radius:23px;padding:18px;margin-bottom:20px;cursor:pointer}#ib-explore .featured:after{content:"";position:absolute;width:150px;height:150px;border-radius:50%;right:-45px;top:-55px;border:1px solid color-mix(in srgb,var(--e-accent-text) 17%,transparent);box-shadow:0 0 0 25px color-mix(in srgb,var(--e-accent-text) 4%,transparent)}#ib-explore .featured small{font-size:11px;opacity:.78}#ib-explore .featured h2{font-size:19px;font-weight:500;margin:6px 0 5px;position:relative;z-index:1}#ib-explore .featured p{font-size:11px;opacity:.78;margin:0 0 15px;position:relative;z-index:1}#ib-explore .featured button{border:0;border-radius:13px;background:color-mix(in srgb,var(--e-accent-text) 14%,transparent);color:var(--e-accent-text);min-height:38px;padding:0 13px;font:inherit;font-size:11px;display:flex;align-items:center;gap:6px;cursor:pointer;position:relative;z-index:1}#ib-explore .featured button i{width:15px;height:15px}
#ib-explore .section-title{font-size:14px;font-weight:500;margin:0 0 11px}#ib-explore .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px}#ib-explore .feature{min-height:125px;border:0;border-radius:20px;background:var(--e-surface);color:var(--e-text);font:inherit;text-align:left;padding:15px;cursor:pointer;position:relative}#ib-explore .feature .icon{width:40px;height:40px;border-radius:14px;background:color-mix(in srgb,var(--e-accent) 11%,var(--e-surface));color:var(--e-accent);display:grid;place-items:center;margin-bottom:13px}#ib-explore .feature .icon i{width:19px;height:19px}#ib-explore .feature strong{display:block;font-size:14px;font-weight:500}#ib-explore .feature small{display:block;font-size:10px;color:var(--e-muted);line-height:1.4;margin-top:4px}#ib-explore .feature .arrow{position:absolute;right:13px;top:17px;width:15px;height:15px;color:var(--e-muted)}
#ib-explore .tools{display:grid;gap:8px}#ib-explore .tool{min-height:58px;border:0;border-radius:17px;background:var(--e-surface);color:var(--e-text);font:inherit;padding:0 14px;display:grid;grid-template-columns:38px 1fr 20px;gap:10px;align-items:center;text-align:left;cursor:pointer}#ib-explore .tool>i:first-child{width:18px;height:18px;color:var(--e-gold)}#ib-explore .tool span{font-size:13px}#ib-explore .tool small{display:block;color:var(--e-muted);font-size:10px;margin-top:2px}#ib-explore .tool>i:last-child{width:16px;height:16px;color:var(--e-muted)}#ib-explore .toast{height:21px;text-align:center;color:var(--e-muted);font-size:11px;padding-top:6px}
#ib-explore .nav{background:var(--e-surface);padding:9px 10px 14px;display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--e-line)}#ib-explore .nav button{min-height:45px;border:0;background:transparent;color:var(--e-muted);font:inherit;font-size:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer}#ib-explore .nav i{width:19px;height:19px}#ib-explore .nav .active{color:var(--e-accent)}
@media(max-width:420px){#ib-explore{padding:0}#ib-explore .device{border-radius:26px}#ib-explore .content{padding-left:15px;padding-right:15px}.grid{gap:8px}}
</style>
<div id="ib-explore" aria-label="Ibadati Explore screen preview">
 <section class="device">
  <div class="status"><span>9:41</span><span class="sys"><i data-lucide="signal" aria-hidden="true"></i><i data-lucide="wifi" aria-hidden="true"></i><i data-lucide="battery-full" aria-hidden="true"></i></span></div>
  <main class="content">
   <header class="head"><h1>Explore</h1><button type="button" aria-label="Saved items"><i data-lucide="bookmark" aria-hidden="true"></i></button></header>
   <label class="search"><i data-lucide="search" aria-hidden="true"></i><input type="search" placeholder="Search duas, azkar and tools" aria-label="Search worship resources"></label>
   <section class="featured"><small>Today’s reflection</small><h2>Begin with remembrance</h2><p>A gentle collection of morning azkar · 7 minutes</p><button type="button" data-open="Morning azkar">Start now <i data-lucide="arrow-right" aria-hidden="true"></i></button></section>
   <h2 class="section-title">Daily worship</h2>
   <div class="grid">
    <button class="feature" type="button" data-open="Duas & Azkar"><span class="icon"><i data-lucide="hand-heart" aria-hidden="true"></i></span><strong>Duas & Azkar</strong><small>Authentic remembrance for every moment</small><i class="arrow" data-lucide="arrow-up-right" aria-hidden="true"></i></button>
    <button class="feature" type="button" data-open="Tasbih"><span class="icon"><i data-lucide="circle-dot" aria-hidden="true"></i></span><strong>Tasbih</strong><small>Count and continue your daily dhikr</small><i class="arrow" data-lucide="arrow-up-right" aria-hidden="true"></i></button>
    <button class="feature" type="button" data-open="Ramadan & Fasting"><span class="icon"><i data-lucide="moon-star" aria-hidden="true"></i></span><strong>Ramadan</strong><small>Fasting calendar, tracker and duas</small><i class="arrow" data-lucide="arrow-up-right" aria-hidden="true"></i></button>
    <button class="feature" type="button" data-open="Zakat Calculator"><span class="icon"><i data-lucide="badge-dollar-sign" aria-hidden="true"></i></span><strong>Zakat</strong><small>Private, guided calculation in your currency</small><i class="arrow" data-lucide="arrow-up-right" aria-hidden="true"></i></button>
   </div>
   <h2 class="section-title">More tools</h2>
   <div class="tools"><button class="tool" type="button" data-open="Islamic calendar"><i data-lucide="calendar-days" aria-hidden="true"></i><span>Islamic calendar<small>Hijri dates and important days</small></span><i data-lucide="chevron-right" aria-hidden="true"></i></button><button class="tool" type="button" data-open="Prayer settings"><i data-lucide="settings-2" aria-hidden="true"></i><span>Prayer settings<small>Calculation method and adjustments</small></span><i data-lucide="chevron-right" aria-hidden="true"></i></button></div>
   <div class="toast" aria-live="polite"></div>
  </main>
  <nav class="nav" aria-label="Main navigation"><button type="button"><i data-lucide="house" aria-hidden="true"></i>Home</button><button type="button"><i data-lucide="clock-3" aria-hidden="true"></i>Prayer</button><button class="active" type="button"><i data-lucide="layout-grid" aria-hidden="true"></i>Explore</button><button type="button"><i data-lucide="compass" aria-hidden="true"></i>Qibla</button><button type="button"><i data-lucide="user-round" aria-hidden="true"></i>Profile</button></nav>
 </section>
</div>
<script>
(()=>{const root=document.getElementById('ib-explore');const state={accent:'#176b5b',featured:true,cardRadius:20};const toast=root.querySelector('.toast');root.querySelectorAll('[data-open]').forEach(button=>button.addEventListener('click',()=>{toast.textContent=`Opening ${button.dataset.open}`}));root.querySelector('input').addEventListener('input',event=>{const term=event.target.value.toLowerCase();root.querySelectorAll('.feature').forEach(item=>item.style.display=item.textContent.toLowerCase().includes(term)?'block':'none')});function render(){root.style.setProperty('--e-accent',state.accent);root.querySelector('.featured').style.display=state.featured?'block':'none';root.querySelectorAll('.feature').forEach(card=>card.style.borderRadius=`${state.cardRadius}px`)}render();if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:render});tweak.addColorPicker(state,'accent',{label:'Brand accent',reference:'--e-accent'});tweak.addToggle(state,'featured',{label:'Daily reflection',reference:'featured.visible'});tweak.addSlider(state,'cardRadius',{label:'Feature radius',min:12,max:28,unit:'px',reference:'feature.radius'})}})();
</script>
