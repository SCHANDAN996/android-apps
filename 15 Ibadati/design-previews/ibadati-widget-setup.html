<div id="ibadati-widget-setup" aria-label="Ibadati home screen widget setup">
<style>#ibadati-widget-setup{--wg-accent:#0f766e;--wg-gold:#b8893d;--wg-bg:light-dark(#f4f0e7,#101917);--wg-surface:light-dark(#fffdf8,#182421);--wg-soft:light-dark(#e4f0ec,#203630);--wg-text:light-dark(#18312d,#edf7f4);--wg-muted:light-dark(#687773,#adbfba);--wg-line:light-dark(#dce4df,#31423d);color-scheme:light dark;color:var(--wg-text);font-family:Inter,ui-sans-serif,system-ui,sans-serif;max-width:430px;margin:auto}#ibadati-widget-setup *{box-sizing:border-box}#ibadati-widget-setup .wg-phone{background:var(--wg-bg);border-radius:28px;overflow:hidden;box-shadow:0 16px 44px light-dark(#143d3524,#00000055)}#ibadati-widget-setup .wg-head{padding:18px;background:var(--wg-surface);display:flex;align-items:center;gap:12px}#ibadati-widget-setup .wg-back{width:44px;height:44px;border:0;border-radius:50%;background:var(--wg-soft);color:var(--wg-text);display:grid;place-items:center}#ibadati-widget-setup h2,#ibadati-widget-setup p{margin:0}#ibadati-widget-setup h2{font-size:20px;font-weight:500}#ibadati-widget-setup .wg-sub{font-size:13px;color:var(--wg-muted);margin-top:3px}#ibadati-widget-setup .wg-main{padding:18px}#ibadati-widget-setup .wg-label{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--wg-muted);margin:0 0 8px 4px}#ibadati-widget-setup .wg-preview-wrap{border-radius:24px;padding:28px 16px;background:linear-gradient(145deg,light-dark(#cbd8d2,#263a35),light-dark(#9bb1aa,#172823))}#ibadati-widget-setup .wg-preview{background:color-mix(in srgb,var(--wg-accent) 90%,transparent);color:#fff;border-radius:22px;padding:17px;box-shadow:0 12px 28px #00000028;min-height:148px}#ibadati-widget-setup .wg-top{display:flex;justify-content:space-between;align-items:center;font-size:11px;opacity:.8}#ibadati-widget-setup .wg-brand{display:flex;align-items:center;gap:6px}#ibadati-widget-setup .wg-prayer{text-align:center;margin-top:18px}#ibadati-widget-setup .wg-prayer span{font-size:12px;opacity:.8}#ibadati-widget-setup .wg-prayer strong{display:block;font-size:30px;font-weight:500;margin-top:4px}#ibadati-widget-setup .wg-prayer p{font-size:12px;margin-top:5px;opacity:.8}#ibadati-widget-setup .wg-all{display:none;grid-template-columns:repeat(5,1fr);gap:3px;margin-top:18px;text-align:center}#ibadati-widget-setup .wg-all span{font-size:9px;opacity:.75}#ibadati-widget-setup .wg-all b{display:block;font-size:11px;margin-top:4px}#ibadati-widget-setup .wg-types{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:18px}#ibadati-widget-setup .wg-type{min-height:76px;border:1px solid transparent;border-radius:16px;background:var(--wg-surface);color:var(--wg-text);display:flex;flex-direction:column;justify-content:center;align-items:center;gap:7px;font-size:11px}#ibadati-widget-setup .wg-type[aria-pressed="true"]{background:var(--wg-soft);color:var(--wg-accent);border-color:var(--wg-accent)}#ibadati-widget-setup .wg-controls{background:var(--wg-surface);border-radius:18px;margin-top:18px;padding:5px 14px}#ibadati-widget-setup .wg-row{min-height:58px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--wg-line)}#ibadati-widget-setup .wg-row:last-child{border-bottom:0}#ibadati-widget-setup .wg-row>i{color:var(--wg-accent)}#ibadati-widget-setup .wg-copy{flex:1}#ibadati-widget-setup .wg-copy strong{font-size:13px;font-weight:500}#ibadati-widget-setup .wg-copy p{font-size:11px;color:var(--wg-muted);margin-top:3px}#ibadati-widget-setup input[type="range"]{width:110px;accent-color:var(--wg-accent)}#ibadati-widget-setup select{min-height:40px;border:0;background:transparent;color:var(--wg-text);font:inherit}#ibadati-widget-setup .wg-add{width:100%;min-height:50px;border:0;border-radius:15px;background:var(--wg-accent);color:#fff;font-size:16px;font-weight:500;margin-top:17px}#ibadati-widget-setup .wg-status{text-align:center;color:var(--wg-accent);font-size:12px;min-height:18px;margin-top:9px}@media(max-width:350px){#ibadati-widget-setup .wg-main,#ibadati-widget-setup .wg-head{padding-left:14px;padding-right:14px}#ibadati-widget-setup input[type="range"]{width:90px}}</style>
<section class="wg-phone"><header class="wg-head"><button class="wg-back" type="button" aria-label="Go back"><i data-lucide="arrow-left" aria-hidden="true"></i></button><div><h2>Home screen widget</h2><p class="wg-sub">Prayer times at a glance</p></div></header><main class="wg-main"><p class="wg-label">Live preview</p><section class="wg-preview-wrap"><article class="wg-preview" id="wg-preview"><div class="wg-top"><span class="wg-brand"><i data-lucide="moon-star" aria-hidden="true"></i>Ibadati</span><span>New Delhi</span></div><div class="wg-prayer" id="wg-next"><span>Next prayer</span><strong>Maghrib · 6:41</strong><p>in 1 hour 24 minutes</p></div><div class="wg-all" id="wg-all"><div><span>Fajr</span><b>5:08</b></div><div><span>Dhuhr</span><b>12:24</b></div><div><span>Asr</span><b>4:48</b></div><div><span>Maghrib</span><b>6:41</b></div><div><span>Isha</span><b>8:02</b></div></div></article></section><div class="wg-types" role="group" aria-label="Widget style"><button class="wg-type" type="button" aria-pressed="true" data-type="next"><i data-lucide="clock-3" aria-hidden="true"></i>Next prayer</button><button class="wg-type" type="button" aria-pressed="false" data-type="all"><i data-lucide="list" aria-hidden="true"></i>All prayers</button><button class="wg-type" type="button" aria-pressed="false" data-type="ramadan"><i data-lucide="moon" aria-hidden="true"></i>Ramadan</button></div><section class="wg-controls"><div class="wg-row"><i data-lucide="palette" aria-hidden="true"></i><div class="wg-copy"><strong>Widget color</strong><p>Match your wallpaper</p></div><select id="wg-color" aria-label="Widget color"><option value="#0f766e">Teal</option><option value="#234a74">Navy</option><option value="#6b4c3b">Earth</option></select></div><div class="wg-row"><i data-lucide="blend" aria-hidden="true"></i><div class="wg-copy"><strong>Transparency</strong><p id="wg-opacity-label">90%</p></div><input id="wg-opacity" type="range" min="65" max="100" value="90" aria-label="Widget transparency"></div></section><button class="wg-add" id="wg-add" type="button">Add widget</button><p class="wg-status" id="wg-status" aria-live="polite"></p></main></section>
<script>(()=>{const root=document.getElementById('ibadati-widget-setup');const types=[...root.querySelectorAll('.wg-type')];const next=root.querySelector('#wg-next');const all=root.querySelector('#wg-all');const preview=root.querySelector('#wg-preview');const status=root.querySelector('#wg-status');let type='next';function showType(){next.style.display=type==='all'?'none':'block';all.style.display=type==='all'?'grid':'none';if(type==='ramadan')next.innerHTML='<span>Iftar in</span><strong>1h 24m</strong><p>Maghrib · 6:41 PM</p>';else if(type==='next')next.innerHTML='<span>Next prayer</span><strong>Maghrib · 6:41</strong><p>in 1 hour 24 minutes</p>'}types.forEach(button=>button.addEventListener('click',()=>{type=button.dataset.type;types.forEach(item=>item.setAttribute('aria-pressed',String(item===button)));showType()}));root.querySelector('#wg-color').addEventListener('change',event=>root.style.setProperty('--wg-accent',event.target.value));const opacity=root.querySelector('#wg-opacity');opacity.addEventListener('input',()=>{root.querySelector('#wg-opacity-label').textContent=`${opacity.value}%`;preview.style.opacity=String(Number(opacity.value)/100)});root.querySelector('#wg-add').addEventListener('click',()=>status.textContent='Widget is ready to add to your home screen.');const state={accent:'#0f766e',radius:22,showLocation:true};function render(){root.style.setProperty('--wg-accent',state.accent);preview.style.borderRadius=`${state.radius}px`;root.querySelector('.wg-top>span:last-child').hidden=!state.showLocation}render();showType();if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:render});tweak.addColorPicker(state,'accent',{label:'Widget accent',reference:'--wg-accent'});tweak.addSlider(state,'radius',{label:'Widget radius',min:10,max:30,unit:'px',reference:'widget.radius'});tweak.addToggle(state,'showLocation',{label:'Show location',reference:'widget.location'})}})();</script>
</div>
