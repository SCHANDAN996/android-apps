<div id="ibadati-action-confirmed" aria-label="Ibadati action confirmation state">
  <style>
    #ibadati-action-confirmed { --ac-teal:#11766f; --ac-gold:#ba8747; --ac-ink:light-dark(#183731,#e5f4ed); --ac-muted:light-dark(#657a73,#a9c0b8); --ac-page:light-dark(#f4f1e9,#102722); --ac-card:light-dark(#fffdf9,#17342e); --ac-soft:light-dark(#e9f3ee,#20453d); --ac-line:light-dark(#d7e1d9,#2a5148); max-width:390px; margin:0 auto; color:var(--ac-ink); font-family:Inter,ui-sans-serif,system-ui,sans-serif; }
    #ibadati-action-confirmed * { box-sizing:border-box; }
    #ibadati-action-confirmed .ac-phone { min-height:605px; padding:21px 16px 25px; overflow:hidden; border-radius:30px; background:var(--ac-page); box-shadow:0 16px 40px light-dark(#50645b33,#0008); text-align:center; }
    #ibadati-action-confirmed .ac-top { display:flex; justify-content:space-between; align-items:center; }
    #ibadati-action-confirmed .ac-wordmark { color:var(--ac-teal); font-size:15px; font-weight:500; }
    #ibadati-action-confirmed .ac-close { width:38px; height:38px; display:grid; place-items:center; border:0; border-radius:12px; color:var(--ac-muted); background:var(--ac-soft); cursor:pointer; }
    #ibadati-action-confirmed .ac-check { width:88px; height:88px; display:grid; place-items:center; margin:48px auto 18px; border-radius:30px; color:#fff; background:linear-gradient(135deg,var(--ac-teal),#0a4e4a); box-shadow:0 11px 22px #0d635837; }
    #ibadati-action-confirmed h1 { margin:0; font-size:23px; font-weight:500; letter-spacing:-.02em; }
    #ibadati-action-confirmed .ac-copy { max-width:276px; margin:8px auto 22px; color:var(--ac-muted); font-size:12px; }
    #ibadati-action-confirmed .ac-summary { padding:15px; border:1px solid var(--ac-line); border-radius:18px; background:var(--ac-card); text-align:left; }
    #ibadati-action-confirmed .ac-summary-top { display:flex; align-items:center; gap:10px; }
    #ibadati-action-confirmed .ac-summary-icon { width:38px; height:38px; display:grid; place-items:center; flex:0 0 auto; border-radius:13px; color:var(--ac-gold); background:#f6ebd8; }
    #ibadati-action-confirmed .ac-summary b { display:block; font-size:13px; font-weight:500; }
    #ibadati-action-confirmed .ac-summary span { display:block; margin-top:3px; color:var(--ac-muted); font-size:11px; }
    #ibadati-action-confirmed .ac-divider { height:1px; margin:13px 0 10px; background:var(--ac-line); }
    #ibadati-action-confirmed .ac-summary-foot { display:flex; justify-content:space-between; color:var(--ac-muted); font-size:11px; }
    #ibadati-action-confirmed .ac-summary-foot strong { color:var(--ac-teal); font-weight:500; }
    #ibadati-action-confirmed .ac-primary { width:100%; margin-top:20px; padding:12px; border:0; border-radius:13px; color:#fff; background:var(--ac-teal); font:500 13px inherit; cursor:pointer; }
    #ibadati-action-confirmed .ac-secondary { width:100%; margin-top:9px; padding:11px; border:0; border-radius:13px; color:var(--ac-teal); background:transparent; font:500 13px inherit; cursor:pointer; }
    #ibadati-action-confirmed .ac-undo { display:none; margin-top:8px; color:var(--ac-muted); font-size:11px; }
    #ibadati-action-confirmed .ac-undo.show { display:block; }
    #ibadati-action-confirmed [data-lucide] { width:22px; height:22px; stroke-width:2; }
  </style>
  <main class="ac-phone"><div class="ac-top"><span class="ac-wordmark">Ibadati</span><button class="ac-close" type="button" aria-label="Close"><i data-lucide="x" aria-hidden="true"></i></button></div><section aria-live="polite"><div class="ac-check"><i data-lucide="check" aria-hidden="true"></i></div><h1 id="ac-title">Fast recorded</h1><p class="ac-copy" id="ac-copy">आपका आज का रोज़ा record हो गया है। अल्लाह आपकी इबादत क़ुबूल फरमाए।</p><article class="ac-summary" id="ac-summary"><div class="ac-summary-top"><div class="ac-summary-icon"><i data-lucide="moon-star" aria-hidden="true"></i></div><div><b id="ac-item">18 Ramadan 1448</b><span id="ac-detail">Completed fast · Today</span></div></div><div class="ac-divider"></div><div class="ac-summary-foot"><span>Ramadan progress</span><strong id="ac-progress">28 of 30 days</strong></div></article><button class="ac-primary" id="ac-home" type="button">Back to home</button><button class="ac-secondary" id="ac-undo-button" type="button">Undo this action</button><p class="ac-undo" id="ac-undo">Action undone. You can record it again whenever needed.</p></section></main>
  <script>
    (()=>{const root=document.getElementById('ibadati-action-confirmed');const state={accent:'#11766f',radius:18,type:'fast',undone:false};const items={fast:{title:'Fast recorded',copy:'आपका आज का रोज़ा record हो गया है। अल्लाह आपकी इबादत क़ुबूल फरमाए।',item:'18 Ramadan 1448',detail:'Completed fast · Today',progress:'28 of 30 days',icon:'moon-star'},zakat:{title:'Zakat payment recorded',copy:'आपका payment record सुरक्षित रूप से save हो गया है।',item:'Annual Zakat 1448',detail:'₹1,62,500 · Paid today',progress:'Next review · 22 Dec 2028',icon:'hand-heart'},settings:{title:'Settings saved',copy:'आपकी Adhan preferences अब अगले prayer time से लागू होंगी।',item:'Adhan notifications',detail:'Enabled · Default Adhan',progress:'Next alert · Asr',icon:'bell-ring'}};function render(){const item=items[state.type];root.style.setProperty('--ac-teal',state.accent);root.querySelector('.ac-check').style.borderRadius=`${state.radius+12}px`;root.querySelector('#ac-summary').style.borderRadius=`${state.radius}px`;root.querySelector('#ac-title').textContent=item.title;root.querySelector('#ac-copy').textContent=item.copy;root.querySelector('#ac-item').textContent=item.item;root.querySelector('#ac-detail').textContent=item.detail;root.querySelector('#ac-progress').textContent=item.progress;root.querySelector('.ac-summary-icon').innerHTML=`<i data-lucide="${item.icon}" aria-hidden="true"></i>`;root.querySelector('#ac-undo').classList.toggle('show',state.undone);if(globalThis.lucide)globalThis.lucide.createIcons({attrs:{width:22,height:22}});}root.querySelector('#ac-undo-button').addEventListener('click',()=>{state.undone=!state.undone;render();});root.querySelector('#ac-home').addEventListener('click',()=>{root.querySelector('#ac-home').textContent='Home opened';});render();if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:render});tweak.addColorPicker(state,'accent',{label:'Accent colour',reference:'--ac-teal'});tweak.addSlider(state,'radius',{label:'Card radius',min:12,max:28,unit:'px'});tweak.addSelect(state,'type',{label:'Confirmation type',options:[{label:'Fast recorded',value:'fast'},{label:'Zakat paid',value:'zakat'},{label:'Settings saved',value:'settings'}]});}})();
  </script>
</div>
