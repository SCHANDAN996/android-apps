<div id="ibadati-global-search" aria-label="Ibadati global search">
<style>#ibadati-global-search{--gs-accent:#0f766e;--gs-gold:#b8893d;--gs-bg:light-dark(#f4f0e7,#101917);--gs-surface:light-dark(#fffdf8,#182421);--gs-soft:light-dark(#e4f0ec,#203630);--gs-text:light-dark(#18312d,#edf7f4);--gs-muted:light-dark(#687773,#adbfba);--gs-line:light-dark(#dce4df,#31423d);color-scheme:light dark;color:var(--gs-text);font-family:Inter,ui-sans-serif,system-ui,sans-serif;max-width:430px;margin:auto}#ibadati-global-search *{box-sizing:border-box}#ibadati-global-search .gs-phone{background:var(--gs-bg);border-radius:28px;overflow:hidden;box-shadow:0 16px 44px light-dark(#143d3524,#00000055);min-height:680px}#ibadati-global-search .gs-head{padding:18px;background:var(--gs-surface)}#ibadati-global-search .gs-title{display:flex;align-items:center;gap:12px;margin-bottom:15px}#ibadati-global-search .gs-back{width:44px;height:44px;border:0;border-radius:50%;background:var(--gs-soft);color:var(--gs-text);display:grid;place-items:center}#ibadati-global-search h2,#ibadati-global-search p{margin:0}#ibadati-global-search h2{font-size:20px;font-weight:500}#ibadati-global-search .gs-search{position:relative}#ibadati-global-search .gs-search>i{position:absolute;left:14px;top:14px;color:var(--gs-muted)}#ibadati-global-search input{width:100%;min-height:48px;border:1px solid var(--gs-line);border-radius:15px;background:var(--gs-bg);color:var(--gs-text);padding:0 42px;font-size:16px}#ibadati-global-search .gs-clear{position:absolute;right:4px;top:2px;width:44px;height:44px;border:0;background:transparent;color:var(--gs-muted)}#ibadati-global-search .gs-main{padding:17px 18px}#ibadati-global-search .gs-chips{display:flex;gap:8px;flex-wrap:wrap}#ibadati-global-search .gs-chip{min-height:40px;border:0;border-radius:99px;background:var(--gs-surface);color:var(--gs-muted);padding:0 14px}#ibadati-global-search .gs-chip[aria-pressed="true"]{background:var(--gs-accent);color:#fff}#ibadati-global-search .gs-label{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--gs-muted);margin:20px 0 8px 4px}#ibadati-global-search .gs-list{background:var(--gs-surface);border-radius:19px;overflow:hidden}#ibadati-global-search .gs-result{width:100%;min-height:70px;border:0;border-bottom:1px solid var(--gs-line);background:transparent;color:var(--gs-text);display:flex;align-items:center;gap:12px;padding:10px 14px;text-align:left}#ibadati-global-search .gs-result:last-child{border-bottom:0}#ibadati-global-search .gs-icon{width:40px;height:40px;border-radius:13px;background:var(--gs-soft);color:var(--gs-accent);display:grid;place-items:center;flex:0 0 auto}#ibadati-global-search .gs-copy{flex:1;min-width:0}#ibadati-global-search .gs-copy strong{display:block;font-size:14px;font-weight:500}#ibadati-global-search .gs-copy span{display:block;font-size:11px;color:var(--gs-muted);margin-top:4px}#ibadati-global-search .gs-type{font-size:10px;color:var(--gs-gold);text-transform:uppercase}#ibadati-global-search .gs-empty{display:none;text-align:center;color:var(--gs-muted);padding:50px 10px}#ibadati-global-search .gs-empty i{color:var(--gs-gold);width:36px;height:36px}#ibadati-global-search .gs-empty strong{display:block;color:var(--gs-text);font-weight:500;margin:10px 0 5px}#ibadati-global-search .gs-empty p{font-size:12px}#ibadati-global-search .gs-opened{text-align:center;color:var(--gs-accent);font-size:12px;min-height:18px;margin-top:10px}@media(max-width:350px){#ibadati-global-search .gs-head,#ibadati-global-search .gs-main{padding-left:14px;padding-right:14px}}</style>
<section class="gs-phone"><header class="gs-head"><div class="gs-title"><button class="gs-back" type="button" aria-label="Go back"><i data-lucide="arrow-left" aria-hidden="true"></i></button><h2>Search Ibadati</h2></div><div class="gs-search"><i data-lucide="search" aria-hidden="true"></i><input id="gs-input" type="search" placeholder="Dua, azkar, prayer setting…" aria-label="Search all Ibadati"><button class="gs-clear" id="gs-clear" type="button" aria-label="Clear search"><i data-lucide="x" aria-hidden="true"></i></button></div></header><main class="gs-main"><div class="gs-chips" role="group" aria-label="Search category"><button class="gs-chip" type="button" aria-pressed="true" data-filter="all">All</button><button class="gs-chip" type="button" aria-pressed="false" data-filter="dua">Duas</button><button class="gs-chip" type="button" aria-pressed="false" data-filter="azkar">Azkar</button><button class="gs-chip" type="button" aria-pressed="false" data-filter="feature">Features</button></div><p class="gs-label" id="gs-label">Popular searches</p><section class="gs-list" id="gs-list">
<button class="gs-result" type="button" data-category="dua" data-search="travel safar journey यात्रा सफर dua"><span class="gs-icon"><i data-lucide="plane" aria-hidden="true"></i></span><span class="gs-copy"><strong>Dua for travel</strong><span>Arabic · Transliteration · Meaning</span></span><span class="gs-type">Dua</span></button>
<button class="gs-result" type="button" data-category="azkar" data-search="morning सुबह subah azkar adhkar"><span class="gs-icon"><i data-lucide="sunrise" aria-hidden="true"></i></span><span class="gs-copy"><strong>Morning Azkar</strong><span>24 remembrances · 8 min</span></span><span class="gs-type">Azkar</span></button>
<button class="gs-result" type="button" data-category="azkar" data-search="evening शाम shaam azkar adhkar"><span class="gs-icon"><i data-lucide="sunset" aria-hidden="true"></i></span><span class="gs-copy"><strong>Evening Azkar</strong><span>14 remembrances · 6 min</span></span><span class="gs-type">Azkar</span></button>
<button class="gs-result" type="button" data-category="feature" data-search="adhan notification alarm अज़ान notification"><span class="gs-icon"><i data-lucide="bell-ring" aria-hidden="true"></i></span><span class="gs-copy"><strong>Adhan notifications</strong><span>Choose sound for each prayer</span></span><span class="gs-type">Setting</span></button>
<button class="gs-result" type="button" data-category="feature" data-search="qibla compass किबला क़िबला दिशा"><span class="gs-icon"><i data-lucide="compass" aria-hidden="true"></i></span><span class="gs-copy"><strong>Qibla compass</strong><span>Direction to the Kaaba · 266°</span></span><span class="gs-type">Feature</span></button>
</section><div class="gs-empty" id="gs-empty"><i data-lucide="search-x" aria-hidden="true"></i><strong>No result found</strong><p>Try another spelling or search in your app language.</p></div><p class="gs-opened" id="gs-opened" aria-live="polite"></p></main></section>
<script>(()=>{const root=document.getElementById('ibadati-global-search');const input=root.querySelector('#gs-input');const results=[...root.querySelectorAll('.gs-result')];const chips=[...root.querySelectorAll('.gs-chip')];const empty=root.querySelector('#gs-empty');let category='all';function filter(){const query=input.value.trim().toLocaleLowerCase();let shown=0;results.forEach(item=>{const visible=(category==='all'||item.dataset.category===category)&&item.dataset.search.includes(query);item.hidden=!visible;if(visible)shown++});empty.style.display=shown?'none':'block';root.querySelector('#gs-label').textContent=query?`${shown} results`:'Popular searches'}input.addEventListener('input',filter);chips.forEach(chip=>chip.addEventListener('click',()=>{category=chip.dataset.filter;chips.forEach(item=>item.setAttribute('aria-pressed',String(item===chip)));filter()}));root.querySelector('#gs-clear').addEventListener('click',()=>{input.value='';filter();input.focus()});results.forEach(item=>item.addEventListener('click',()=>root.querySelector('#gs-opened').textContent=`Opening ${item.querySelector('strong').textContent}…`));const state={accent:'#0f766e',radius:19,showFilters:true};const chipBox=root.querySelector('.gs-chips');function render(){root.style.setProperty('--gs-accent',state.accent);root.querySelector('.gs-list').style.borderRadius=`${state.radius}px`;chipBox.hidden=!state.showFilters}render();filter();if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:render});tweak.addColorPicker(state,'accent',{label:'Accent color',reference:'--gs-accent'});tweak.addSlider(state,'radius',{label:'Result radius',min:10,max:28,unit:'px',reference:'search.radius'});tweak.addToggle(state,'showFilters',{label:'Show category filters',reference:'search.filters'})}})();</script>
</div>
