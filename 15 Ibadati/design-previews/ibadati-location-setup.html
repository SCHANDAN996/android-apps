<style>
#ib-location {
  --loc-bg: light-dark(#f4f1e8, #0d2724);
  --loc-surface: light-dark(#fffdf7, #14332f);
  --loc-text: light-dark(#18332f, #f7f1df);
  --loc-muted: light-dark(#687873, #b6c6bf);
  --loc-accent: light-dark(#176b5b, #77c7ad);
  --loc-accent-text: light-dark(#ffffff, #09231f);
  --loc-gold: light-dark(#b58b3b, #d8b768);
  --loc-line: light-dark(rgba(23,107,91,.16), rgba(119,199,173,.18));
  font-family: Inter, system-ui, sans-serif;
  color:var(--loc-text);
  display:grid;
  place-items:center;
  padding:12px;
}
#ib-location * { box-sizing:border-box; }
#ib-location .device { width:min(100%,390px); min-height:690px; background:var(--loc-bg); border:1px solid var(--loc-line); border-radius:34px; overflow:hidden; box-shadow:0 22px 70px rgba(0,0,0,.16); }
#ib-location .status { display:flex; justify-content:space-between; align-items:center; padding:18px 24px 8px; font-size:12px; font-weight:500; }
#ib-location .system { display:flex; gap:8px; }
#ib-location .system i { width:14px; height:14px; }
#ib-location .screen { min-height:638px; padding:18px 24px 24px; display:flex; flex-direction:column; }
#ib-location .top { display:flex; align-items:center; justify-content:space-between; }
#ib-location .back { width:44px; height:44px; border:0; background:transparent; color:var(--loc-text); display:grid; place-items:center; cursor:pointer; }
#ib-location .back i { width:20px; height:20px; }
#ib-location .step { color:var(--loc-muted); font-size:12px; }
#ib-location .visual { width:178px; height:178px; margin:24px auto 26px; border-radius:50%; display:grid; place-items:center; position:relative; background:linear-gradient(145deg,color-mix(in srgb,var(--loc-surface) 94%,transparent),color-mix(in srgb,var(--loc-gold) 10%,var(--loc-surface))); box-shadow:inset 0 0 0 1px var(--loc-line),0 20px 45px color-mix(in srgb,var(--loc-accent) 12%,transparent); }
#ib-location .visual:before, #ib-location .visual:after { content:""; position:absolute; border:1px solid var(--loc-line); border-radius:50%; }
#ib-location .visual:before { inset:25px; }
#ib-location .visual:after { inset:49px; }
#ib-location .pin { width:58px; height:58px; border-radius:20px 20px 20px 6px; display:grid; place-items:center; color:var(--loc-accent-text); background:var(--loc-accent); z-index:1; transform:rotate(-8deg); box-shadow:0 12px 25px color-mix(in srgb,var(--loc-accent) 28%,transparent); }
#ib-location .pin i { width:26px; height:26px; transform:rotate(8deg); }
#ib-location h1 { margin:0 0 12px; font-size:30px; line-height:1.16; font-weight:500; letter-spacing:-.025em; }
#ib-location .copy { margin:0; color:var(--loc-muted); font-size:15px; line-height:1.55; }
#ib-location .benefits { display:grid; gap:12px; margin:24px 0; }
#ib-location .benefit { display:flex; gap:12px; align-items:center; font-size:14px; }
#ib-location .benefit .icon { width:34px; height:34px; border-radius:12px; display:grid; place-items:center; background:color-mix(in srgb,var(--loc-accent) 11%,var(--loc-surface)); color:var(--loc-accent); flex:0 0 auto; }
#ib-location .benefit i { width:17px; height:17px; }
#ib-location .privacy { display:flex; gap:9px; align-items:flex-start; padding:13px 14px; background:var(--loc-surface); border-radius:15px; color:var(--loc-muted); font-size:12px; line-height:1.45; }
#ib-location .privacy i { width:16px; height:16px; color:var(--loc-gold); flex:0 0 auto; margin-top:1px; }
#ib-location .actions { margin-top:auto; padding-top:22px; display:grid; gap:10px; }
#ib-location .primary, #ib-location .secondary { min-height:54px; border-radius:18px; font:inherit; font-weight:500; display:flex; justify-content:center; align-items:center; gap:9px; cursor:pointer; }
#ib-location .primary { border:0; background:var(--loc-accent); color:var(--loc-accent-text); }
#ib-location .secondary { border:0; background:transparent; color:var(--loc-accent); }
#ib-location .primary i, #ib-location .secondary i { width:18px; height:18px; }
#ib-location .result { min-height:20px; text-align:center; color:var(--loc-muted); font-size:12px; }
@media(max-width:420px){#ib-location{padding:0}#ib-location .device{border-radius:26px;min-height:660px}#ib-location .screen{min-height:610px}#ib-location .visual{width:152px;height:152px;margin-top:18px;margin-bottom:20px}}
</style>

<div id="ib-location" aria-label="Ibadati location setup preview">
  <section class="device">
    <div class="status"><span>9:41</span><span class="system"><i data-lucide="signal" aria-hidden="true"></i><i data-lucide="wifi" aria-hidden="true"></i><i data-lucide="battery-full" aria-hidden="true"></i></span></div>
    <div class="screen">
      <div class="top"><button class="back" type="button" aria-label="Go back"><i data-lucide="arrow-left" aria-hidden="true"></i></button><span class="step">2 of 3</span></div>
      <div class="visual" aria-hidden="true"><span class="pin"><i data-lucide="map-pin"></i></span></div>
      <h1>Accurate prayer times,<br>wherever you are.</h1>
      <p class="copy">Your location helps Ibadati calculate prayer times and the Qibla direction for your city.</p>
      <div class="benefits">
        <div class="benefit"><span class="icon"><i data-lucide="clock-3" aria-hidden="true"></i></span><span>Times adjusted to your local timezone</span></div>
        <div class="benefit"><span class="icon"><i data-lucide="compass" aria-hidden="true"></i></span><span>Precise Qibla direction from your position</span></div>
      </div>
      <div class="privacy"><i data-lucide="shield-check" aria-hidden="true"></i><span>Your precise location stays on your device. You remain in control.</span></div>
      <div class="actions">
        <div class="result" aria-live="polite"></div>
        <button class="primary" type="button"><i data-lucide="locate-fixed" aria-hidden="true"></i>Use my location</button>
        <button class="secondary" type="button"><i data-lucide="search" aria-hidden="true"></i>Choose city manually</button>
      </div>
    </div>
  </section>
</div>

<script>
(() => {
  const root = document.getElementById('ib-location');
  const result = root.querySelector('.result');
  const state = { accent:'#176b5b', privacy:true, compact:false };
  root.querySelector('.primary').addEventListener('click', () => { result.textContent = 'Location permission would open here'; });
  root.querySelector('.secondary').addEventListener('click', () => { result.textContent = 'City search would open here'; });
  function render() {
    root.style.setProperty('--loc-accent', state.accent);
    root.querySelector('.privacy').style.display = state.privacy ? 'flex' : 'none';
    root.querySelector('.visual').style.width = state.compact ? '140px' : '';
    root.querySelector('.visual').style.height = state.compact ? '140px' : '';
  }
  render();
  if (globalThis.Tweak) {
    const tweak = new Tweak({container:root,onChange:render});
    tweak.addColorPicker(state,'accent',{label:'Brand accent',reference:'--loc-accent'});
    tweak.addToggle(state,'privacy',{label:'Privacy note',reference:'privacy.visible'});
    tweak.addToggle(state,'compact',{label:'Compact illustration',reference:'visual.compact'});
  }
})();
</script>
