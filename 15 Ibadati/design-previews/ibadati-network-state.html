<div id="ibadati-network-state" aria-label="Ibadati loading and offline states">
  <style>
    #ibadati-network-state { --ns-teal:#11766f; --ns-ink:light-dark(#183731,#e5f4ed); --ns-muted:light-dark(#657a73,#a9c0b8); --ns-page:light-dark(#f4f1e9,#102722); --ns-card:light-dark(#fffdf9,#17342e); --ns-soft:light-dark(#e9f3ee,#20453d); --ns-line:light-dark(#d7e1d9,#2a5148); max-width:390px; margin:0 auto; color:var(--ns-ink); font-family:Inter,ui-sans-serif,system-ui,sans-serif; }
    #ibadati-network-state * { box-sizing:border-box; }
    #ibadati-network-state .ns-phone { min-height:600px; overflow:hidden; border-radius:30px; background:var(--ns-page); box-shadow:0 16px 40px light-dark(#50645b33,#0008); }
    #ibadati-network-state .ns-top { padding:20px; color:#f8fffb; background:linear-gradient(145deg,var(--ns-teal),#0a4e4a); }
    #ibadati-network-state .ns-topline { display:flex; align-items:center; justify-content:space-between; }
    #ibadati-network-state .ns-logo { width:38px; height:38px; display:grid; place-items:center; border-radius:12px; background:#ffffff24; }
    #ibadati-network-state .ns-city { font-size:13px; color:#d5ede5; }
    #ibadati-network-state .ns-skeleton-title { width:55%; height:20px; margin:20px 0 8px; border-radius:8px; background:#ffffff2d; }
    #ibadati-network-state .ns-skeleton-sub { width:36%; height:12px; border-radius:7px; background:#ffffff1f; }
    #ibadati-network-state .ns-body { padding:18px 16px 25px; }
    #ibadati-network-state .ns-preview { display:grid; grid-template-columns:1fr 1fr; gap:7px; padding:5px; border-radius:15px; background:var(--ns-soft); }
    #ibadati-network-state .ns-preview button { border:0; border-radius:11px; padding:9px; background:transparent; color:var(--ns-muted); font:12px inherit; cursor:pointer; }
    #ibadati-network-state .ns-preview button.active { color:var(--ns-teal); background:var(--ns-card); box-shadow:0 2px 8px light-dark(#153a2b16,#0003); font-weight:500; }
    #ibadati-network-state .ns-loading { display:grid; gap:12px; margin-top:18px; }
    #ibadati-network-state .ns-load-card { padding:14px; border:1px solid var(--ns-line); border-radius:17px; background:var(--ns-card); }
    #ibadati-network-state .ns-line { height:12px; border-radius:8px; background:var(--ns-soft); }
    #ibadati-network-state .ns-line.short { width:44%; margin-top:11px; }
    #ibadati-network-state .ns-line.medium { width:70%; margin-top:11px; }
    #ibadati-network-state .ns-prayers { display:grid; grid-template-columns:repeat(5,1fr); gap:8px; }
    #ibadati-network-state .ns-prayer { height:63px; border-radius:13px; background:var(--ns-soft); }
    #ibadati-network-state .ns-offline { padding:28px 15px 12px; text-align:center; }
    #ibadati-network-state .ns-offline[hidden], #ibadati-network-state .ns-loading[hidden] { display:none; }
    #ibadati-network-state .ns-orbit { width:76px; height:76px; display:grid; place-items:center; margin:0 auto 16px; border-radius:26px; color:var(--ns-teal); background:var(--ns-soft); }
    #ibadati-network-state .ns-offline h1 { margin:0; font-size:19px; font-weight:500; }
    #ibadati-network-state .ns-offline p { max-width:250px; margin:8px auto 17px; color:var(--ns-muted); font-size:12px; }
    #ibadati-network-state .ns-retry { width:100%; padding:12px; border:0; border-radius:13px; background:var(--ns-teal); color:#fff; font:500 13px inherit; cursor:pointer; }
    #ibadati-network-state .ns-saved { display:flex; align-items:center; gap:10px; margin-top:17px; padding:12px; border-radius:14px; background:#f6ebd8; color:#68491f; text-align:left; }
    #ibadati-network-state .ns-saved b { display:block; font-size:12px; font-weight:500; }
    #ibadati-network-state .ns-saved span { display:block; margin-top:3px; color:#76552a; font-size:11px; }
    #ibadati-network-state .ns-note { margin-top:17px; color:var(--ns-muted); font-size:11px; text-align:center; }
    #ibadati-network-state [data-lucide] { width:20px; height:20px; stroke-width:1.8; }
  </style>
  <main class="ns-phone">
    <header class="ns-top"><div class="ns-topline"><div class="ns-logo"><i data-lucide="moon-star" aria-hidden="true"></i></div><span class="ns-city">New Delhi</span></div><div class="ns-skeleton-title"></div><div class="ns-skeleton-sub"></div></header>
    <section class="ns-body" aria-live="polite">
      <div class="ns-preview" role="tablist" aria-label="Connection state preview"><button class="active" type="button" aria-selected="true" id="ns-load-tab">Loading</button><button type="button" aria-selected="false" id="ns-offline-tab">No internet</button></div>
      <section class="ns-loading" id="ns-loading" aria-label="Loading app data"><article class="ns-load-card"><div class="ns-line"></div><div class="ns-line short"></div></article><article class="ns-load-card"><div class="ns-prayers"><div class="ns-prayer"></div><div class="ns-prayer"></div><div class="ns-prayer"></div><div class="ns-prayer"></div><div class="ns-prayer"></div></div></article><article class="ns-load-card"><div class="ns-line medium"></div><div class="ns-line"></div></article><p class="ns-note">Prayer times और आज की जानकारी सुरक्षित रूप से load हो रही है…</p></section>
      <section class="ns-offline" id="ns-offline" hidden aria-label="No internet state"><div class="ns-orbit"><i data-lucide="wifi-off" aria-hidden="true"></i></div><h1>You’re offline</h1><p>इंटरनेट से जुड़ने पर नवीनतम prayer times और content फिर से load हो जाएगा।</p><button class="ns-retry" id="ns-retry" type="button">Retry connection</button><div class="ns-saved"><i data-lucide="download" aria-hidden="true"></i><div><b>Saved content is still available</b><span>Downloaded duas, azkar और आपका tasbih record</span></div></div><p class="ns-note" id="ns-retry-note">आपका last known prayer schedule दिखाया जा सकता है।</p></section>
    </section>
  </main>
  <script>
    (() => {
      const root=document.getElementById('ibadati-network-state');
      const state={accent:'#11766f',radius:17,offline:false};
      const loading=root.querySelector('#ns-loading'); const offline=root.querySelector('#ns-offline'); const tabs=[root.querySelector('#ns-load-tab'),root.querySelector('#ns-offline-tab')];
      function render(){ root.style.setProperty('--ns-teal',state.accent); root.querySelectorAll('.ns-load-card,.ns-orbit').forEach((el)=>{el.style.borderRadius=`${state.radius}px`;}); loading.hidden=state.offline; offline.hidden=!state.offline; tabs[0].classList.toggle('active',!state.offline);tabs[1].classList.toggle('active',state.offline);tabs[0].setAttribute('aria-selected',String(!state.offline));tabs[1].setAttribute('aria-selected',String(state.offline)); }
      tabs[0].addEventListener('click',()=>{state.offline=false;render();}); tabs[1].addEventListener('click',()=>{state.offline=true;render();});
      root.querySelector('#ns-retry').addEventListener('click',()=>{ root.querySelector('#ns-retry-note').textContent='Checking connection…'; setTimeout(()=>{root.querySelector('#ns-retry-note').textContent='अभी connection नहीं मिला। आप अपने saved content इस्तेमाल कर सकते हैं।';},500); });
      render(); if(globalThis.lucide)globalThis.lucide.createIcons({attrs:{width:20,height:20}});
      if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:render});tweak.addColorPicker(state,'accent',{label:'Accent colour',reference:'--ns-teal'});tweak.addSlider(state,'radius',{label:'Card radius',min:12,max:26,unit:'px'});tweak.addToggle(state,'offline',{label:'Show offline state'});}
    })();
  </script>
</div>
