<div id="ibadati-fast-log" aria-label="Ibadati daily fast log">
  <style>
    #ibadati-fast-log{--fl-accent:#0f766e;--fl-gold:#b8893d;--fl-bg:light-dark(#f4f0e7,#101917);--fl-surface:light-dark(#fffdf8,#182421);--fl-soft:light-dark(#e4f0ec,#203630);--fl-text:light-dark(#18312d,#edf7f4);--fl-muted:light-dark(#687773,#adbfba);--fl-line:light-dark(#dce4df,#31423d);color-scheme:light dark;color:var(--fl-text);font-family:Inter,ui-sans-serif,system-ui,sans-serif;max-width:430px;margin:0 auto}
    #ibadati-fast-log *{box-sizing:border-box}#ibadati-fast-log .fl-phone{background:var(--fl-bg);border-radius:28px;overflow:hidden;box-shadow:0 16px 44px light-dark(#143d3524,#00000055)}
    #ibadati-fast-log .fl-head{padding:18px;background:var(--fl-surface);display:flex;align-items:center;gap:12px}#ibadati-fast-log .fl-back{width:44px;height:44px;border:0;border-radius:50%;background:var(--fl-soft);color:var(--fl-text);display:grid;place-items:center}#ibadati-fast-log h2,#ibadati-fast-log h3,#ibadati-fast-log p{margin:0}#ibadati-fast-log h2{font-size:20px;font-weight:500}#ibadati-fast-log .fl-sub{font-size:13px;color:var(--fl-muted);margin-top:3px}
    #ibadati-fast-log .fl-main{padding:18px}#ibadati-fast-log .fl-day{background:var(--fl-surface);border-radius:20px;padding:16px;display:flex;align-items:center;gap:14px}#ibadati-fast-log .fl-date{width:58px;height:62px;border-radius:16px;background:var(--fl-soft);display:grid;place-items:center;color:var(--fl-accent)}#ibadati-fast-log .fl-date strong{display:block;font-size:23px;line-height:1}#ibadati-fast-log .fl-date span{font-size:12px}#ibadati-fast-log .fl-day-copy{flex:1}#ibadati-fast-log .fl-day-copy strong{font-weight:500}#ibadati-fast-log .fl-day-copy span{display:block;color:var(--fl-muted);font-size:13px;margin-top:4px}#ibadati-fast-log .fl-moon{color:var(--fl-gold)}
    #ibadati-fast-log .fl-label{color:var(--fl-muted);font-size:12px;letter-spacing:.06em;text-transform:uppercase;margin:20px 0 9px 4px}#ibadati-fast-log .fl-options{display:grid;grid-template-columns:1fr 1fr;gap:10px}#ibadati-fast-log .fl-option{min-height:92px;border:1px solid transparent;border-radius:18px;background:var(--fl-surface);color:var(--fl-text);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;font-size:14px}#ibadati-fast-log .fl-option i{color:var(--fl-muted)}#ibadati-fast-log .fl-option[aria-pressed="true"]{background:var(--fl-soft);border-color:var(--fl-accent);color:var(--fl-accent)}#ibadati-fast-log .fl-option[aria-pressed="true"] i{color:var(--fl-accent)}
    #ibadati-fast-log .fl-detail{margin-top:14px;background:var(--fl-surface);border-radius:18px;padding:14px}#ibadati-fast-log .fl-detail[hidden]{display:none}#ibadati-fast-log label{display:block;font-size:13px;color:var(--fl-muted);margin-bottom:7px}#ibadati-fast-log select,#ibadati-fast-log textarea{width:100%;min-height:46px;border:1px solid var(--fl-line);border-radius:13px;background:var(--fl-bg);color:var(--fl-text);padding:10px 12px;font:inherit}#ibadati-fast-log textarea{min-height:72px;resize:vertical;margin-top:12px;font-size:16px}
    #ibadati-fast-log .fl-impact{display:flex;align-items:center;gap:10px;margin-top:14px;padding:12px;color:var(--fl-muted);font-size:13px}#ibadati-fast-log .fl-impact i{color:var(--fl-gold)}#ibadati-fast-log .fl-save{width:100%;min-height:50px;border:0;border-radius:15px;background:var(--fl-accent);color:#fff;font-size:16px;font-weight:500;margin-top:16px}#ibadati-fast-log .fl-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:18px}#ibadati-fast-log .fl-stat{background:var(--fl-surface);border-radius:15px;padding:12px 8px;text-align:center}#ibadati-fast-log .fl-stat strong{display:block;font-size:20px;font-weight:500}#ibadati-fast-log .fl-stat span{font-size:11px;color:var(--fl-muted)}#ibadati-fast-log .fl-toast{margin-top:12px;text-align:center;color:var(--fl-accent);font-size:13px;min-height:20px}
    @media(max-width:350px){#ibadati-fast-log .fl-head,#ibadati-fast-log .fl-main{padding-left:14px;padding-right:14px}}
  </style>
  <section class="fl-phone">
    <header class="fl-head"><button class="fl-back" type="button" aria-label="Go back"><i data-lucide="arrow-left" aria-hidden="true"></i></button><div><h2>Log today’s fast</h2><p class="fl-sub">Your record stays private on this device</p></div></header>
    <main class="fl-main">
      <section class="fl-day"><div class="fl-date"><div><strong>12</strong><span>RAM</span></div></div><div class="fl-day-copy"><strong>Tuesday, 2 September</strong><span>12 Ramadan 1448 · New Delhi</span></div><i class="fl-moon" data-lucide="moon-star" aria-hidden="true"></i></section>
      <p class="fl-label">Today’s status</p>
      <div class="fl-options" role="group" aria-label="Fast status">
        <button class="fl-option" type="button" aria-pressed="true" data-status="completed"><i data-lucide="circle-check-big" aria-hidden="true"></i><span>Fast completed</span></button>
        <button class="fl-option" type="button" aria-pressed="false" data-status="missed"><i data-lucide="circle-minus" aria-hidden="true"></i><span>Not fasting</span></button>
      </div>
      <section class="fl-detail" id="fl-missed-detail" hidden>
        <label for="fl-reason">Reason <span aria-hidden="true">(optional)</span></label>
        <select id="fl-reason"><option value="">Prefer not to say</option><option>Illness</option><option>Travel</option><option>Menstruation</option><option>Pregnancy or nursing</option><option>Other</option></select>
        <textarea id="fl-note" aria-label="Private note" placeholder="Add a private note…"></textarea>
      </section>
      <div class="fl-impact"><i data-lucide="info" aria-hidden="true"></i><span id="fl-impact-text">This will add one completed fast to your Ramadan record.</span></div>
      <button class="fl-save" id="fl-save" type="button">Save today</button>
      <div class="fl-toast" id="fl-toast" aria-live="polite"></div>
      <section class="fl-stats" aria-label="Ramadan fasting summary"><div class="fl-stat"><strong id="fl-completed">11</strong><span>Completed</span></div><div class="fl-stat"><strong id="fl-qada">0</strong><span>Qada due</span></div><div class="fl-stat"><strong>18</strong><span>Remaining</span></div></section>
    </main>
  </section>
  <script>
    (()=>{const root=document.getElementById('ibadati-fast-log');const choices=[...root.querySelectorAll('.fl-option')];const detail=root.querySelector('#fl-missed-detail');const impact=root.querySelector('#fl-impact-text');const toast=root.querySelector('#fl-toast');let status='completed';let saved=false;choices.forEach(choice=>choice.addEventListener('click',()=>{status=choice.dataset.status;choices.forEach(item=>item.setAttribute('aria-pressed',String(item===choice)));detail.hidden=status!=='missed';impact.textContent=status==='missed'?'This day will be added to your qada reminder list.':'This will add one completed fast to your Ramadan record.';toast.textContent='';}));root.querySelector('#fl-save').addEventListener('click',()=>{if(!saved){root.querySelector(status==='completed'?'#fl-completed':'#fl-qada').textContent=status==='completed'?'12':'1';saved=true;}toast.textContent=status==='completed'?'Fast saved. May Allah accept it.':'Saved privately. You can update this anytime.';});const state={accent:'#0f766e',cornerRadius:18,showSummary:true};const summary=root.querySelector('.fl-stats');function render(){root.style.setProperty('--fl-accent',state.accent);root.querySelectorAll('.fl-option,.fl-detail').forEach(el=>el.style.borderRadius=`${state.cornerRadius}px`);summary.hidden=!state.showSummary;}render();if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:render});tweak.addColorPicker(state,'accent',{label:'Accent color',reference:'--fl-accent'});tweak.addSlider(state,'cornerRadius',{label:'Control radius',min:10,max:26,unit:'px',reference:'fastlog.radius'});tweak.addToggle(state,'showSummary',{label:'Show summary',reference:'fastlog.summary'});}})();
  </script>
</div>
