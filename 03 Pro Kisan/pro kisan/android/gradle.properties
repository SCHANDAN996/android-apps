org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# tflite_flutter का Java 11 पर और Kotlin 17 पर compile होता है। Gradle इस बेमेल
# को गलती मानकर build रोक देता है। plugin का code हम बदल नहीं सकते, इसलिए इस
# जाँच को चेतावनी बना देते हैं (JetBrains का आधिकारिक रास्ता)। असर सिर्फ़ जाँच
# पर है — bytecode वैसा ही बनता है।
kotlin.jvm.target.validation.mode=warning

# Disable NDK symbol stripping error during appbundle packaging
android.stripNativeDebugMetadata=false
