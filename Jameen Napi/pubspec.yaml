name: jameen_napi
description: "Jameen Napi - Land calculator with offline conversions, GPS field measurement and map measurement."
publish_to: 'none'

version: 1.1.0+6

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.2.2
  share_plus: ^10.1.4
  google_mobile_ads: ^9.0.0
  url_launcher: ^6.3.2
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  geolocator: ^14.0.2
  wakelock_plus: ^1.5.2


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#1B5E20"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
