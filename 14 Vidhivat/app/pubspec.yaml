name: vidhivat
description: "विधिवत — पूजा विधि, पंचांग, मुहूर्त। 100% ऑफलाइन।"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  # cupertino_icons हटा दिया — ऐप में कहीं इस्तेमाल नहीं था, पर उसका
  # CupertinoIcons.ttf (260 KB) हर build में जाता था (→ D-043)।
  shared_preferences: ^2.2.2
  share_plus: ^11.1.0
  # सिर्फ़ app खुला होने पर एक बार स्थान लेकर सूर्योदय/पंचांग सही करने के लिए।
  geolocator: ^14.0.2

  # विधि प्लेयर के लिए — पूजा के बीच स्क्रीन बंद नहीं होनी चाहिए
  wakelock_plus: ^1.2.8

  # स्वैच्छिक दक्षिणा — ऐप की इकलौती कमाई (→ D-053, docs/20_KAMAI_YOJANA.md)
  #
  # ⚠️ यह ऐप का **इकलौता** network छूने वाला package है, और वह भी सिर्फ़
  # तब जब यूज़र ख़ुद दक्षिणा का बटन दबाए। बाक़ी वक़्त ऐप पूरी तरह ऑफलाइन
  # है — इसीलिए Data safety में "कोई डेटा इकट्ठा नहीं" सच है (भुगतान
  # Google Play संभालता है, ऐप नहीं: न कार्ड, न नाम, न ईमेल)।
  in_app_purchase: ^3.3.0

  # पंचांग इंजन — शुद्ध Dart, कोई Flutter निर्भरता नहीं
  panchang_engine:
    path: ../engine

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  # पूजा का कंटेंट — सब ऐप के अंदर बंडल, कोई डाउनलोड नहीं (→ D-004)
  #
  # ⚠️ पहली रिकॉर्डिंग आते ही यहाँ `- assets/vidhi/audio/` भी जोड़ना
  # पड़ेगा — Flutter सिर्फ़ इसी फ़ोल्डर की फ़ाइलें लेता है, अंदर वाले
  # फ़ोल्डर की नहीं। (अभी नहीं जोड़ा क्योंकि ख़ाली फ़ोल्डर पर build टूटता है।)
  assets:
    - assets/vidhi/
    - assets/paath/
    - assets/katha/
    - assets/images/devotional/
