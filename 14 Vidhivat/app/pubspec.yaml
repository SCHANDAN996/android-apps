name: vidhivat
description: "विधिवत — पूजा विधि, पंचांग, मुहूर्त। 100% ऑफलाइन।"
publish_to: 'none'

version: 1.2.0+6

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  # Flutter के अपने डिब्बे (तारीख़/समय चुनना, "ठीक है/रद्द करें") हिंदी में —
  # SDK के साथ आता है, बाहर से कुछ नहीं (→ main.dart, 19 अक्टूबर 2026)
  flutter_localizations:
    sdk: flutter
  # cupertino_icons हटा दिया — ऐप में कहीं इस्तेमाल नहीं था, पर उसका
  # CupertinoIcons.ttf (260 KB) हर build में जाता था (→ D-043)।
  shared_preferences: ^2.2.2
  flutter_local_notifications: ^22.3.1
  timezone: ^0.11.1
  share_plus: ^11.1.0
  # सिर्फ़ app खुला होने पर एक बार स्थान लेकर सूर्योदय/पंचांग सही करने के लिए।
  geolocator: ^14.0.2

  # विधि प्लेयर के लिए — पूजा के बीच स्क्रीन बंद नहीं होनी चाहिए
  wakelock_plus: ^1.2.8

  # स्वैच्छिक दक्षिणा — PayU का पन्ना बाहर (browser/UPI app में) खोलने के
  # लिए (→ D-090, docs/20_KAMAI_YOJANA.md)। पहले `in_app_purchase` था; Play
  # से पैसा पाने वाली BillDesk KYC मंज़ूर नहीं हुई (23 सित 2026)।
  #
  # ⚠️ ऐप ख़ुद network नहीं छूता — बटन दबने पर सिर्फ़ PayU का link बाहर
  # खुलता है। भुगतान वहीं होता है; ऐप को न कार्ड, न UPI, न नाम मिलता है।
  url_launcher: ^6.3.1

  # पंचांग इंजन — शुद्ध Dart, कोई Flutter निर्भरता नहीं
  panchang_engine:
    path: ../engine

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  # पूजा का कंटेंट — सब ऐप के अंदर बंडल, कोई डाउनलोड नहीं (→ D-004)
  #
  # ⚠️ पहली रिकॉर्डिंग आते ही यहाँ `- assets/vidhi/audio/` भी जोड़ना
  # पड़ेगा — Flutter सिर्फ़ इसी फ़ोल्डर की फ़ाइलें लेता है, अंदर वाले
  # फ़ोल्डर की नहीं। (अभी नहीं जोड़ा क्योंकि ख़ाली फ़ोल्डर पर build टूटता है।)
  assets:
    - assets/vidhi/
    - assets/vidhi/navratri/
    - assets/paath/
    - assets/paath/saptashati/
    # ग्रंथालय (→ D-098) — हर ग्रंथ का अपना फ़ोल्डर, और हर फ़ोल्डर यहाँ
    # अलग लिखना पड़ता है (Flutter अंदर वाले फ़ोल्डर नहीं लेता)।
    - assets/granth/
    - assets/granth/gita/
    - assets/granth/sundarkand/
    - assets/granth/vishnusahasranama/
    - assets/granth/sukta/
    - assets/granth/upanishad/
    - assets/granth/mahabharat/
    - assets/granth/puran/
    - assets/katha/
    - assets/vrat/
    - assets/parv/
    - assets/images/devotional/
    # गाँव-क़स्बों की सूची (→ D-128) — tools/banao_gaon.py से
    - assets/jagah/
