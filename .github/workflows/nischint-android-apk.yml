name: Nischint Android APKs

on:
  push:
    paths:
      - "16 Nischint/**"
      - ".github/workflows/nischint-android-apk.yml"
  pull_request:
    paths:
      - "16 Nischint/**"
  workflow_dispatch:

jobs:
  core:
    name: Shared package (analyze + test)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: "16 Nischint/packages/nischint_core"
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test

  app:
    name: Build ${{ matrix.label }} APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - dir: customer
            project: nischint
            label: "निश्चिंत"
            artifact: nischint-customer-debug-apk
          - dir: partner
            project: nischint_partner
            label: "निश्चिंत पार्टनर"
            artifact: nischint-partner-debug-apk
    defaults:
      run:
        working-directory: "16 Nischint/apps/${{ matrix.dir }}"
    steps:
      - name: Check out the source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate the Android project
        run: |
          flutter create --platforms=android --org com.schandan996 --project-name ${{ matrix.project }} .
          # flutter create must not replace our own code
          git checkout -- lib test pubspec.yaml analysis_options.yaml
          sed -i 's/android:label="${{ matrix.project }}"/android:label="${{ matrix.label }}"/' android/app/src/main/AndroidManifest.xml
          grep -n 'android:label' android/app/src/main/AndroidManifest.xml

      - name: Get packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        run: flutter test

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: "16 Nischint/apps/${{ matrix.dir }}/build/app/outputs/flutter-apk/app-debug.apk"
          if-no-files-found: error
