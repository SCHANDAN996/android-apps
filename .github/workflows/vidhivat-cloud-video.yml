name: Vidhivat cloud app video

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/vidhivat-cloud-video.yml
      - 14 Vidhivat/tools/cloud_video/**
  workflow_dispatch:

permissions:
  contents: write

jobs:
  record:
    name: Build and record Vidhivat in a cloud browser
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      APP_DIR: 14 Vidhivat/app
      RECORDING_DIR: recording
      PUBLISH_BRANCH: vidhivat-recordings

    steps:
      - name: Check out the source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build a web preview
        working-directory: ${{ env.APP_DIR }}
        run: |
          flutter config --enable-web
          flutter pub get
          flutter create --platforms=web .
          flutter build web --release

      - name: Record the web preview as vertical video
        run: |
          set -euo pipefail
          mkdir -p "${RECORDING_DIR}"
          cd "${APP_DIR}/build/web"
          python3 -m http.server 8080 >/tmp/vidhivat-web-server.log 2>&1 &
          server_pid=$!
          trap 'kill "${server_pid}" || true' EXIT
          for attempt in {1..20}; do
            curl --silent --fail http://127.0.0.1:8080 >/dev/null && break
            sleep 1
          done
          cd "${GITHUB_WORKSPACE}"
          npm install --no-save playwright@1.57.0
          npx playwright install --with-deps chromium
          RECORDING_DIR="${RECORDING_DIR}" node "14 Vidhivat/tools/cloud_video/capture_web.mjs"

      - name: Publish the recording as a downloadable video
        run: |
          set -euo pipefail
          publish_dir="$(mktemp -d)"
          git -C "${publish_dir}" init -q
          git -C "${publish_dir}" config user.name "Vidhivat video bot"
          git -C "${publish_dir}" config user.email "actions@github.com"
          cp "${RECORDING_DIR}/vidhivat-web-emulator.webm" "${publish_dir}/vidhivat-app-recording.webm"
          git -C "${publish_dir}" add vidhivat-app-recording.webm
          git -C "${publish_dir}" commit -m "Publish latest Vidhivat app recording"
          git -C "${publish_dir}" branch -M "${PUBLISH_BRANCH}"
          git -C "${publish_dir}" remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git -C "${publish_dir}" push --force origin "${PUBLISH_BRANCH}"

      - name: Upload the app recording
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vidhivat-cloud-browser-recording-${{ github.run_id }}
          path: ${{ env.RECORDING_DIR }}
          if-no-files-found: error
          retention-days: 14
