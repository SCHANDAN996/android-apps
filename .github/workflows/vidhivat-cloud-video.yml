name: Vidhivat cloud app video

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/vidhivat-cloud-video.yml
  workflow_dispatch:
    inputs:
      duration_seconds:
        description: Recording duration (10 to 180 seconds)
        required: true
        default: "50"
        type: string

permissions:
  contents: read

jobs:
  record:
    name: Build, install and record in a cloud Android emulator
    runs-on: ubuntu-latest
    env:
      APP_DIR: 14 Vidhivat/app
      APP_APK: 14 Vidhivat/app/build/app/outputs/flutter-apk/app-debug.apk
      RECORDING_SECONDS: ${{ inputs.duration_seconds || '50' }}

    steps:
      - name: Check out the source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build a debug APK
        working-directory: ${{ env.APP_DIR }}
        run: |
          flutter pub get
          flutter build apk --debug

      - name: Install and record on a cloud Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: pixel
          emulator-options: -no-window -noaudio -no-boot-anim -gpu swiftshader_indirect -no-snapshot
          disable-animations: true
          script: bash "14 Vidhivat/tools/cloud_video/record.sh"

      - name: Upload the app recording
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vidhivat-emulator-recording-${{ github.run_id }}
          path: recording
          if-no-files-found: error
          retention-days: 14
