name: Vidhivat cloud app video

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/vidhivat-cloud-video.yml
  workflow_dispatch:
    inputs:
      duration_seconds:
        description: Recording duration (10 to 180 seconds)
        required: true
        default: "50"
        type: string

permissions:
  contents: read

jobs:
  record:
    name: Build, install and record in a cloud Android emulator
    runs-on: ubuntu-latest
    env:
      APP_DIR: 14 Vidhivat/app
      APP_APK: 14 Vidhivat/app/build/app/outputs/flutter-apk/app-debug.apk
      RECORDING_SECONDS: ${{ inputs.duration_seconds || '50' }}

    steps:
      - name: Check out the source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build a debug APK
        working-directory: ${{ env.APP_DIR }}
        run: |
          flutter pub get
          flutter build apk --debug

      - name: Install and record on a cloud Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -noaudio -no-boot-anim -gpu swiftshader_indirect
          disable-animations: true
          script: |
            set -euo pipefail
            case "${RECORDING_SECONDS}" in
              ''|*[!0-9]*) echo "duration_seconds must be a number"; exit 1 ;;
            esac
            if [ "${RECORDING_SECONDS}" -lt 10 ] || [ "${RECORDING_SECONDS}" -gt 180 ]; then
              echo "duration_seconds must be between 10 and 180"
              exit 1
            fi

            mkdir -p recording
            adb install -r -g "${APP_APK}"
            adb shell pm grant com.vidhivat android.permission.ACCESS_FINE_LOCATION || true
            adb shell pm grant com.vidhivat android.permission.ACCESS_COARSE_LOCATION || true
            adb shell am force-stop com.vidhivat
            adb shell monkey -p com.vidhivat 1 >/dev/null
            sleep 4
            adb exec-out screencap -p > recording/first-frame.png

            adb shell screenrecord \
              --bit-rate 8000000 \
              --time-limit "${RECORDING_SECONDS}" \
              /sdcard/vidhivat-emulator.mp4 >/tmp/vidhivat-screenrecord.log 2>&1 &
            recorder_pid=$!
            sleep "${RECORDING_SECONDS}"
            wait "${recorder_pid}" || true

            adb pull /sdcard/vidhivat-emulator.mp4 recording/vidhivat-emulator.mp4
            adb pull /tmp/vidhivat-screenrecord.log recording/screenrecord.log || true

      - name: Upload the app recording
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vidhivat-emulator-recording-${{ github.run_id }}
          path: recording
          if-no-files-found: error
          retention-days: 14
